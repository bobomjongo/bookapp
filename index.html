<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a2219">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('folioNS_theme')==='dark'?'dark':'light');}catch(e){}</script>
<title>FolioOS · Novel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --clay:#9E5236; --ochre:#B08744; --moss:#67714F; --indigo:#39424F; --mulberry:#6D4650; --umber:#55402C;
    --paper:#EFE6D8; --paper-deep:#E7DCC9; --bone:#FBF6EC; --ink:#2A2219; --ink-soft:#5E5344;
    --graphite:#8B7E6B; --rule:#D9CDB9; --accent:var(--clay);
    --glide:cubic-bezier(0.22,1,0.36,1); --settle:cubic-bezier(0.33,1,0.68,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:'EB Garamond',serif; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; overflow:hidden; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;}
  .center,.tree,.inspector,.ed-scroll,.cork,.outl,.cover-view,#library{-webkit-overflow-scrolling:touch;}
  button,input,textarea,select{font-family:inherit; color:inherit;}
  button{cursor:pointer; border:none; background:none;}
  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--rule); border-radius:5px; border:2px solid var(--paper);}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ===================== THRESHOLD ===================== */
  #threshold{
    position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 62%, #2a2119, #17130e 75%);
    color:var(--bone); cursor:pointer; transition:opacity 1s var(--glide);
  }
  #threshold .date{font-family:'Instrument Sans',sans-serif; font-size:13px; letter-spacing:.34em; text-transform:uppercase; color:#8a7c63; margin-bottom:26px;}
  #threshold .line{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:38px; color:#efe6d3;}
  #threshold .hint{position:absolute; bottom:52px; font-style:italic; font-size:14px; color:#8a7c63;}
  #threshold.gone{opacity:0; pointer-events:none;}

  /* ===================== LIBRARY ===================== */
  #library{position:fixed; inset:0; overflow-y:auto; background:
      linear-gradient(180deg, var(--bone), var(--paper) 240px);}
  .lib-inner{max-width:1120px; margin:0 auto; padding:54px 48px 100px;}
  .lib-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  .wordmark{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:22px; letter-spacing:.32em; text-transform:uppercase; color:var(--ink);}
  .wordmark em{color:var(--clay); font-style:normal;}
  .lib-actions{display:flex; gap:22px;}
  .pencil{font-style:italic; font-size:15px; color:var(--ink-soft); border-bottom:1px solid transparent; padding-bottom:1px; transition:all .2s;}
  .pencil:hover{color:var(--clay); border-bottom-color:var(--clay);}
  .lib-sub{font-style:italic; font-size:18px; color:var(--ink-soft); margin-bottom:44px;}
  .shelf{display:grid; grid-template-columns:repeat(auto-fill, minmax(184px,1fr)); gap:46px 34px; align-items:end;}
  .novel{cursor:pointer; transition:transform .25s var(--glide);}
  .novel:hover{transform:translateY(-6px);}
  .cover{
    position:relative; width:100%; aspect-ratio:2/3; border-radius:3px 6px 6px 3px;
    box-shadow:0 10px 26px rgba(42,34,25,.28), inset 3px 0 6px rgba(0,0,0,.16), inset -1px 0 2px rgba(255,255,255,.1);
    overflow:hidden; display:flex; flex-direction:column; background-size:cover; background-position:center;
  }
  .cover::after{content:''; position:absolute; left:8px; top:0; bottom:0; width:2px; background:linear-gradient(90deg, rgba(0,0,0,.22), transparent);}
  .cover .cov-inner{position:relative; z-index:2; flex:1; display:flex; flex-direction:column; padding:22px 18px; text-align:center;}
  .cover .cov-top{flex:1; display:flex; align-items:center; justify-content:center;}
  .cover .cov-title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:26px; line-height:1.08; color:#f7f0e2; text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .cover .cov-rule{width:34px; height:1px; background:rgba(247,240,226,.6); margin:12px auto;}
  .cover .cov-author{font-family:'EB Garamond',serif; font-style:italic; font-size:14px; letter-spacing:.05em; color:#e7dcc4; text-shadow:0 1px 5px rgba(0,0,0,.5);}
  .cover.imgcov .cov-inner{background:linear-gradient(180deg, rgba(20,16,11,.28), rgba(20,16,11,.06) 40%, rgba(20,16,11,.62));}
  .novel-meta{margin-top:14px; text-align:center;}
  .novel-meta .nm{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:17px; color:var(--ink); line-height:1.1;}
  .novel-meta .wc{font-size:12.5px; color:var(--graphite); font-style:italic; margin-top:2px;}
  .new-novel .cover{background:transparent; box-shadow:none; border:1.5px dashed var(--rule); align-items:center; justify-content:center;}
  .new-novel .cover::after{display:none;}
  .new-novel .plus{font-size:40px; color:var(--graphite); font-weight:300;}
  .new-novel:hover .cover{border-color:var(--clay);} .new-novel:hover .plus{color:var(--clay);}

  /* ===================== WORKSPACE ===================== */
  #workspace{position:fixed; inset:0; display:flex; flex-direction:column;}
  .topbar{height:52px; display:flex; align-items:center; gap:20px; padding:0 20px; border-bottom:1px solid var(--rule); background:linear-gradient(180deg,var(--bone),var(--paper));}
  .back{font-style:italic; color:var(--ink-soft); font-size:15px; transition:color .2s;}
  .back:hover{color:var(--clay);}
  .crumb{display:flex; align-items:baseline; gap:10px; min-width:0;}
  .crumb .k{font-family:'Instrument Sans',sans-serif; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--graphite);}
  .crumb .t{font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .spacer{flex:1;}
  .vtog{display:flex; gap:2px; background:var(--paper-deep); border:1px solid var(--rule); border-radius:9px; padding:3px;}
  .vtog button{font-family:'Instrument Sans',sans-serif; font-size:11px; letter-spacing:.05em; padding:6px 14px; border-radius:6px; color:var(--ink-soft); transition:all .2s var(--glide);}
  .vtog button.active{background:var(--bone); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .ticon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--graphite);font-size:15px;transition:all .2s;}
  .ticon:hover{background:var(--paper-deep); color:var(--ink);}
  .ticon.on{color:var(--clay);}

  .frame{flex:1; display:flex; min-height:0;}
  .binder{width:250px; flex-shrink:0; background:var(--paper-deep); border-right:1px solid var(--rule); display:flex; flex-direction:column;}
  .center{flex:1; min-width:0; background:var(--paper); position:relative; overflow:hidden;}
  .inspector{width:296px; flex-shrink:0; background:var(--paper-deep); border-left:1px solid var(--rule); overflow-y:auto;}
  .frame.no-insp .inspector{display:none;}

  /* binder */
  .binder-head{padding:14px 14px 8px; display:flex; align-items:center; justify-content:space-between;}
  .binder-head .lbl{font-family:'Instrument Sans',sans-serif; font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--graphite);}
  .binder-tools{display:flex; gap:2px;}
  .binder-tools button{width:24px;height:24px;border-radius:5px;color:var(--graphite);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .18s;}
  .binder-tools button:hover{background:var(--bone);color:var(--clay);}
  .cover-item{margin:2px 10px 6px; padding:8px 10px; border-radius:6px; display:flex; align-items:center; gap:9px; cursor:pointer; transition:background .15s;}
  .cover-item:hover{background:rgba(255,255,255,.5);}
  .cover-item.sel{background:var(--bone); box-shadow:inset 2px 0 0 var(--accent);}
  .cover-thumb{width:26px; height:38px; border-radius:2px; background-size:cover; background-position:center; box-shadow:0 1px 3px rgba(0,0,0,.25); flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .cover-thumb .mini{font-family:'Cormorant Garamond',serif; font-size:7px; color:#f7f0e2; text-align:center; line-height:1; padding:2px;}
  .cover-item .ci-txt{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:14.5px; color:var(--ink); line-height:1.05;}
  .cover-item .ci-sub{font-size:10px; color:var(--graphite); font-style:italic;}
  .tree{flex:1; overflow-y:auto; padding:0 8px 12px;}
  .row{display:flex; align-items:center; gap:5px; padding:5px 6px; border-radius:5px; font-size:14.5px; color:var(--ink-soft); cursor:pointer; user-select:none; position:relative;}
  .row:hover{background:rgba(255,255,255,.5);}
  .row.sel{background:var(--bone); color:var(--ink); box-shadow:inset 2px 0 0 var(--accent);}
  .row.drop-above{box-shadow:inset 0 2px 0 var(--clay);}
  .row.drop-in{background:rgba(158,82,54,.12);}
  .row .tw{width:12px;text-align:center;color:var(--graphite);font-size:9px;flex-shrink:0;transition:transform .18s var(--glide);}
  .row.open .tw{transform:rotate(90deg);}
  .row .ic{width:16px;flex-shrink:0;font-size:13px;opacity:.75;text-align:center;}
  .row .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .ct{font-size:11px;color:var(--graphite);font-variant-numeric:tabular-nums;}
  .row .mv{display:none; gap:1px;}
  .row:hover .mv{display:flex;}
  .row:hover .ct{display:none;}
  .row .mv button{width:15px;height:15px;font-size:8px;color:var(--graphite);display:flex;align-items:center;justify-content:center;border-radius:3px;}
  .row .mv button:hover{background:var(--paper-deep);color:var(--clay);}
  .row .mv button[data-del]{color:#8B5A4A;}
  .row .mv button[data-del]:hover{color:#C44536;background:var(--paper-deep);}
  .cbox-veil{position:fixed;inset:0;z-index:299;background:rgba(30,24,17,.42);}
  .confirm-delete{position:fixed;z-index:300;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100vw - 32px));background:var(--bone);border:1px solid var(--rule);border-radius:9px;box-shadow:0 12px 40px rgba(42,34,25,.32);padding:24px 28px;}

  /* sync pill + dot */
  .sync-pill{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border:1px solid var(--rule);border-radius:20px;background:var(--bone);font-family:'Instrument Sans',sans-serif;font-size:11px;letter-spacing:.03em;color:var(--ink-soft);transition:border-color .2s;}
  .sync-pill:hover{border-color:var(--clay);}
  .sync-pill.mini{padding:5px 9px;}
  .sync-pill.mini .sync-txt{display:none;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--graphite);flex-shrink:0;}
  .sync-pill[data-k="ok"] .sync-dot{background:var(--moss);}
  .sync-pill[data-k="wait"] .sync-dot{background:var(--ochre);animation:pulse 1.4s ease-in-out infinite;}
  .sync-pill[data-k="err"] .sync-dot{background:#C44536;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .lib-actions{align-items:center;flex-wrap:wrap;}

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:500;max-width:min(440px,calc(100vw - 32px));background:var(--ink);color:var(--bone);padding:11px 18px;border-radius:9px;font-size:15px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .3s,transform .3s var(--glide);}
  .toast.show{opacity:1;transform:translate(-50%,0);}

  /* shelf: delete + recently deleted */
  .novel{position:relative;}
  .novel-x{position:absolute;top:-9px;right:-9px;width:30px;height:30px;border-radius:50%;background:var(--bone);border:1px solid var(--rule);color:var(--ink-soft);font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);opacity:0;transition:opacity .2s;z-index:3;}
  .novel:hover .novel-x,.novel-x:focus{opacity:1;}
  .novel-x:hover{color:#C44536;border-color:#C44536;}
  @media (hover:none){ .novel-x{opacity:1;} }
  .rd{margin-top:56px;border-top:1px solid var(--rule);padding-top:18px;}
  .rd-head{font-style:italic;color:var(--ink-soft);font-size:15px;}
  .rd-head button{font-style:italic;color:var(--clay);margin-left:10px;border-bottom:1px solid transparent;}
  .rd-head button:hover{border-bottom-color:var(--clay);}
  .rd-row{display:flex;align-items:center;gap:14px;padding:11px 0;border-bottom:1px solid rgba(217,205,185,.6);flex-wrap:wrap;}
  .rd-row .t{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:18px;flex:1;min-width:140px;}
  .rd-row .w{font-size:13px;color:var(--graphite);font-style:italic;}
  .rd-row button{font-style:italic;font-size:14px;color:var(--ink-soft);}
  .rd-row button:hover{color:var(--clay);}
  .rd-row button.danger{color:#A63A2A;}
  .danger-link{display:inline-block;margin-top:30px;font-style:italic;font-size:14px;color:#A63A2A;border-bottom:1px solid transparent;}
  .danger-link:hover{border-bottom-color:#A63A2A;}

  /* account sheet */
  .acct h2{margin-bottom:4px;}
  .acct .who{font-size:16px;margin:2px 0 14px;word-break:break-all;}
  .acct .state{display:flex;align-items:center;gap:9px;font-size:15px;color:var(--ink-soft);margin-bottom:6px;}
  .acct .note{font-size:13.5px;color:var(--graphite);font-style:italic;line-height:1.5;margin-top:12px;}
  .acct .err{font-size:14px;color:#A63A2A;margin-top:12px;line-height:1.45;}
  .gbtn{display:block;width:100%;padding:12px 16px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);font-family:'Instrument Sans',sans-serif;font-size:14px;color:var(--ink);transition:all .2s;margin-top:6px;}
  .gbtn:hover{border-color:var(--clay);background:var(--paper-deep);}
  .gbtn.primary{background:var(--clay);color:var(--bone);border-color:var(--clay);}
  .gbtn.primary:hover{background:var(--umber);border-color:var(--umber);}
  .acct .row2{display:flex;gap:10px;margin-top:14px;}
  .acct .row2 .gbtn{margin-top:0;}
  .confirm-delete h3{font-family:'Cormorant Garamond',serif;font-size:20px;margin-bottom:8px;}
  .confirm-delete p{font-size:15px;color:var(--ink-soft);margin-bottom:20px;line-height:1.45;}
  .confirm-delete .actions{display:flex;gap:14px;justify-content:flex-end;}
  .confirm-delete button{padding:8px 18px;border-radius:6px;font-size:14px;border:1px solid var(--rule);}
  .confirm-delete .cancel{background:transparent;color:var(--ink-soft);}
  .confirm-delete .cancel:hover{background:var(--paper-deep);}
  .confirm-delete .delete{background:#C44536;color:var(--bone);}
  .confirm-delete .delete:hover{background:#A63A2A;}
  .row.folder .nm{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:15.5px;}
  .row .rename{flex:1;font:inherit;background:var(--bone);border:1px solid var(--clay);border-radius:3px;padding:1px 4px;outline:none;}
  .binder-foot{padding:9px 14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--graphite);font-style:italic;display:flex;justify-content:space-between;}
  .trash-head{margin:6px 14px 2px; font-family:'Instrument Sans',sans-serif; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--graphite); display:flex; justify-content:space-between; align-items:center;}
  .trash-head button{font-size:10px; font-style:italic; color:var(--graphite); text-transform:none; letter-spacing:0;}
  .trash-head button:hover{color:var(--clay);}

  /* cover view */
  .cover-view{height:100%; overflow-y:auto; display:flex; gap:52px; padding:52px 56px; justify-content:center;}
  .cover-stage{flex-shrink:0;}
  .big-cover{width:300px; aspect-ratio:2/3; border-radius:4px 8px 8px 4px; box-shadow:0 20px 50px rgba(42,34,25,.34), inset 4px 0 10px rgba(0,0,0,.18); overflow:hidden; display:flex; flex-direction:column; background-size:cover; background-position:center; position:relative;}
  .big-cover::after{content:''; position:absolute; left:12px; top:0; bottom:0; width:3px; background:linear-gradient(90deg, rgba(0,0,0,.24), transparent);}
  .bc-inner{position:relative; z-index:2; flex:1; display:flex; flex-direction:column; padding:38px 28px; text-align:center;}
  .bc-top{flex:1; display:flex; align-items:center; justify-content:center;}
  .bc-title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:38px; line-height:1.06; color:#f7f0e2; text-shadow:0 2px 10px rgba(0,0,0,.55);}
  .bc-rule{width:44px;height:1px;background:rgba(247,240,226,.6);margin:18px auto;}
  .bc-author{font-family:'EB Garamond',serif;font-style:italic;font-size:17px;color:#ecdfc6;text-shadow:0 1px 8px rgba(0,0,0,.5);}
  .bc-sub{font-family:'EB Garamond',serif;font-style:italic;font-size:13px;color:#d6c8ab;margin-top:8px;text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .big-cover.imgcov .bc-inner{background:linear-gradient(180deg, rgba(20,16,11,.3), rgba(20,16,11,.05) 40%, rgba(20,16,11,.66));}
  .cover-panel{width:340px; max-width:100%;}
  .cover-panel h2{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:26px; margin-bottom:4px;}
  .cover-panel .ph{font-style:italic; color:var(--ink-soft); font-size:15px; margin-bottom:26px;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-family:'Instrument Sans',sans-serif; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--graphite); margin-bottom:6px;}
  .field input[type=text]{width:100%; background:var(--bone); border:1px solid var(--rule); border-radius:4px; padding:9px 11px; font-family:'Cormorant Garamond',serif; font-size:18px; outline:none; transition:border-color .2s;}
  .field input[type=text]:focus{border-color:var(--clay);}
  .cloth-row{display:flex; gap:9px; flex-wrap:wrap;}
  .cloth-dot{width:26px;height:26px;border-radius:50%; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); transition:transform .15s;}
  .cloth-dot:hover{transform:scale(1.12);}
  .cloth-dot.on{box-shadow:0 0 0 2px var(--bone), 0 0 0 4px var(--ink);}
  .mode-row{display:flex; gap:8px; margin-bottom:18px;}
  .seg{flex:1; text-align:center; font-family:'Instrument Sans',sans-serif; font-size:11px; letter-spacing:.04em; padding:8px; border:1px solid var(--rule); border-radius:6px; color:var(--ink-soft); background:var(--bone); transition:all .2s;}
  .seg.on{border-color:var(--clay); color:var(--ink); background:var(--paper);}
  .upload-btn{display:inline-block; font-style:italic; font-size:15px; color:var(--clay); border-bottom:1px solid var(--clay); padding-bottom:1px; cursor:pointer;}
  .cover-note{font-size:13px; color:var(--graphite); font-style:italic; margin-top:6px;}

  /* editor */
  .ed-scroll{height:100%; overflow-y:auto; display:flex; justify-content:center; padding:46px 20px 140px;}
  .sheet{width:100%; max-width:668px;}
  .scriv-div{display:flex;align-items:center;gap:14px;margin:44px 0 26px;opacity:.7;}
  .scriv-div .ln{flex:1;height:1px;background:var(--rule);}
  .scriv-div .lab{font-family:'Instrument Sans',sans-serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite);}
  .doc-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;color:var(--ink);margin-bottom:3px;outline:none;}
  .doc-sub{font-family:'Instrument Sans',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);margin-bottom:22px;}
  .prose{font-size:19px; line-height:1.66; color:#33291d; outline:none; min-height:300px;}
  .prose:empty::before{content:attr(data-ph); color:var(--graphite); font-style:italic;}
  .prose p{margin-bottom:1.05em;}
  .kept{margin-top:24px; font-style:italic; font-size:13px; color:var(--graphite); opacity:0; transition:opacity .4s;}
  .kept.show{opacity:1;}

  /* corkboard */
  .cork{height:100%; overflow-y:auto; padding:34px 40px 100px;

  .card{background:var(--bone);border-radius:3px;min-height:176px;box-shadow:0 3px 12px rgba(42,34,25,.14),0 1px 2px rgba(42,34,25,.1);display:flex;flex-direction:column;position:relative;cursor:pointer;transition:transform .2s var(--glide),box-shadow .2s;border-top:4px solid var(--accent);}

  .card::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8b46a,#9c7a34);box-shadow:0 1px 2px rgba(0,0,0,.35);}

  .card .cf{padding:7px 16px 11px;display:flex;align-items:center;justify-content:space-between;}
  .card .cf .st{font-family:'Instrument Sans',sans-serif;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);border:1px solid var(--rule);border-radius:20px;padding:2px 8px;}
  .card .cf .wc{font-size:11px;color:var(--graphite);}
  .card .cmv{position:absolute; bottom:8px; right:10px; display:none; gap:2px;}
  .card:hover .cmv{display:flex;}
  .card:hover .cf .wc{visibility:hidden;}
  .card .cmv button{width:17px;height:17px;font-size:9px;border-radius:3px;color:var(--graphite);background:var(--paper-deep);display:flex;align-items:center;justify-content:center;}

  .add-card{background:transparent;border:1.5px dashed var(--rule);box-shadow:none;align-items:center;justify-content:center;color:var(--graphite);font-style:italic;}
  .add-card::before{display:none;} .add-card:hover{transform:none;border-color:var(--clay);color:var(--clay);}

  /* outliner */
  .outl{height:100%;overflow:auto;}

  .syn-card .sy{padding:10px 13px;font-size:14px;line-height:1.5;color:var(--ink-soft);font-style:italic;min-height:70px;outline:none;}

  .mrow{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:14px;}
  .mrow .ml{color:var(--graphite);font-size:13px;}
  .picker{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;border:1px solid var(--rule);background:var(--bone);font-size:13px;color:var(--ink);cursor:pointer;transition:border-color .2s;}
  .picker:hover{border-color:var(--clay);}

  .chips{display:flex;flex-wrap:wrap;gap:6px;}

  .notes-area{width:100%;min-height:94px;background:var(--bone);border:1px solid var(--rule);border-radius:3px;padding:10px 12px;font-family:'EB Garamond',serif;font-size:14px;line-height:1.5;color:var(--ink-soft);resize:vertical;outline:none;}
  .tbar{height:7px;border-radius:4px;background:var(--paper);overflow:hidden;margin-top:8px;border:1px solid var(--rule);}
  .tfill{height:100%;background:linear-gradient(90deg,var(--moss),var(--ochre));}

  .target-input{width:66px;background:var(--bone);border:1px solid var(--rule);border-radius:4px;padding:3px 6px;font-size:13px;text-align:right;outline:none;}

  /* tiny popover menu */
  .menu{position:fixed;z-index:300;background:var(--bone);border:1px solid var(--rule);border-radius:7px;box-shadow:0 8px 26px rgba(42,34,25,.24);padding:5px;min-width:150px;}

  /* compile */
  .compile-btn{font-family:'Instrument Sans',sans-serif;font-size:11px;letter-spacing:.05em;padding:7px 15px;border-radius:7px;border:1px solid var(--rule);background:var(--bone);color:var(--ink-soft);transition:all .2s;}
  .compile-btn:hover{border-color:var(--clay);color:var(--clay);}
  .veil{position:fixed;inset:0;z-index:400;background:rgba(30,24,17,.44);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s;}
  .veil.show{opacity:1;visibility:visible;}
  .modal{background:var(--bone);border:1px solid var(--rule);border-radius:9px;box-shadow:0 26px 64px rgba(0,0,0,.36);width:460px;max-width:92vw;max-height:90vh;overflow:auto;padding:30px 32px;}

  .modal .flabel{font-family:'Instrument Sans',sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);margin:18px 0 8px;}
  .fmt-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .fmt{text-align:center;padding:13px 4px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);cursor:pointer;transition:all .18s;}
  .fmt .ic{font-size:19px;display:block;margin-bottom:5px;line-height:1;}

  .fmt.on{border-color:var(--clay);background:var(--paper-deep);color:var(--ink);box-shadow:0 2px 9px rgba(158,82,54,.2);}
  .scope-sel{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);font-family:'EB Garamond',serif;font-size:16px;outline:none;}
  .opt-row{display:flex;align-items:center;gap:11px;margin:11px 0;cursor:pointer;font-size:15.5px;user-select:none;}
  .opt-box{width:19px;height:19px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--clay);flex-shrink:0;}

  .modal-actions .cancel{font-style:italic;color:var(--ink-soft);}
  .modal-actions .cancel:hover{color:var(--clay);}
  .modal-actions .go{background:var(--clay);color:var(--bone);padding:10px 24px;border-radius:7px;font-family:'Instrument Sans',sans-serif;font-size:13px;letter-spacing:.03em;transition:background .2s;}
  .modal-actions .go:hover{background:var(--umber);}
  .compile-note{font-size:12.5px;color:var(--graphite);font-style:italic;margin-top:14px;line-height:1.45;}

  /* ===================== MOBILE ===================== */
  .binder-toggle{display:none;}
  .back-in-binder{display:none;}
  #drawerScrim{display:none;}

    .crumb{order:2;flex:1;min-width:0;}

    .spacer{display:none;}
    .vtog{order:10;width:100%;margin-top:2px;}
    .vtog button{flex:1;padding:9px 6px;}
    .crumb .t{font-size:18px;}

    .binder{left:0;width:86vw;max-width:332px;transform:translateX(-103%);}
    .inspector{right:0;width:88vw;max-width:344px;display:flex!important;flex-direction:column;transform:translateX(103%);}
    .frame.no-insp .inspector{display:flex!important;}
    body.show-binder .binder{transform:none;}
    body.show-inspector .inspector{transform:none;}
    .center{width:100%;}

    .row{padding:9px 6px;}

    .row .ct{display:none;}
    .row .mv button{width:24px;height:24px;font-size:10px;}
    .card .cmv{display:flex;}
    .card .cf .wc{display:none;}
    .card .cmv button{width:26px;height:26px;font-size:12px;}

    .lib-inner{padding:30px 18px 80px;}
    .lib-top{flex-wrap:wrap;gap:12px;}
    .lib-actions{gap:10px 18px;}
    #wsSync{order:2;}
    .acct .row2{flex-direction:column;}
    .lib-sub{font-size:16px;margin-bottom:26px;}
    .shelf{grid-template-columns:repeat(2,1fr);gap:30px 18px;}
    .cover .cov-title{font-size:20px;}

    .cover-view{flex-direction:column;align-items:center;justify-content:flex-start;gap:28px;padding:26px 18px calc(90px + env(safe-area-inset-bottom));}
    .big-cover{width:214px;flex-shrink:0;}
    .crumb .k{display:none;}

    .binder,.inspector{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);}
    .lib-inner{padding-top:calc(30px + env(safe-area-inset-top));padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right));padding-bottom:calc(80px + env(safe-area-inset-bottom));}
    .cover-panel{width:100%;max-width:440px;}

    .ed-scroll{padding:26px 16px 150px;}
    .sheet{max-width:100%;}
    .doc-title{font-size:26px;}
    .prose{font-size:18px;}

    .cork{padding:26px 16px 90px;}
    .cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px;}

    .outl td:nth-child(5),.outl th:nth-child(5){display:none;}
    thead th{padding:10px 10px;} tbody td{padding:8px 10px;}
    .o-syn{display:none;}

    #threshold .line{font-size:28px;padding:0 24px;text-align:center;}

  /* ===================== v0.7 ===================== */
  :root{ --prose:#33291d; }
  html[data-theme="dark"]{
    --paper:#1b1610; --paper-deep:#241d15; --bone:#2c241b; --ink:#efe6d3; --ink-soft:#c8baa0; --graphite:#9c8f78; --rule:#3b3227; --prose:#e6dcc7;
    color-scheme:dark;

  html[data-theme="dark"] .row:hover, html[data-theme="dark"] .cover-item:hover{background:rgba(255,255,255,.07);}

  .prose{color:var(--prose);}
  .prose p.sb{text-align:center;text-indent:0;color:var(--graphite);letter-spacing:.3em;}

  /* ⋯ and find buttons, menu details */
  .menu .meta{color:var(--graphite);font-size:12px;}

  .linkish{font-style:italic;color:var(--clay);text-decoration:underline;font-size:inherit;}

  /* focus mode */
  #focusExit{display:none;position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:130;font-family:'Instrument Sans',sans-serif;font-size:11px;letter-spacing:.05em;color:var(--graphite);padding:8px 15px;border:1px solid var(--rule);border-radius:20px;background:var(--bone);opacity:.5;}

  .sr-more{font-size:12.5px;color:var(--graphite);font-style:italic;padding:2px 0 0 11px;}
  .modal-actions .go:disabled{opacity:.4;cursor:default;}

  /* snapshots */
  .snap-take{font-family:'Instrument Sans',sans-serif;font-size:12px;padding:7px 13px;border:1px dashed var(--rule);border-radius:7px;color:var(--ink-soft);width:100%;}

  .snap-row .when:hover{color:var(--clay);}
  .snap-row .meta{font-size:11.5px;color:var(--graphite);font-style:italic;}
  .snap-row .x{color:var(--graphite);font-size:11px;padding:4px 6px;}

  .diff{max-height:52vh;overflow:auto;border:1px solid var(--rule);border-radius:7px;padding:14px 18px;background:var(--paper);font-size:16px;line-height:1.6;}

  .diff del{background:rgba(196,69,54,.2);text-decoration:line-through;color:var(--ink);}

  /* goals */
  .goal-line{padding:8px 14px 2px;cursor:pointer;border-top:1px solid var(--rule);}

  .gl-bar{height:5px;border-radius:3px;background:var(--paper);border:1px solid var(--rule);overflow:hidden;}

  .gstats span{font-size:11.5px;color:var(--graphite);font-style:italic;}
  .gchart{display:flex;align-items:flex-end;gap:5px;height:64px;margin:0 0 16px;}

  .field input[type=text],.field input[type=date]{width:100%;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:9px 11px;font-family:'Cormorant Garamond',serif;font-size:18px;outline:none;color:var(--ink);}

  /* linked notes */
  .chip.link{cursor:pointer;}
  .chip.link:hover{border-color:var(--clay);color:var(--ink);}

  @media (max-width:820px){
    #scrivBtn{display:none;}
    .compile-btn{display:none;}
    #findBtn,#moreBtn{order:3;}
    .srch-inputs{grid-template-columns:1fr;}

    .fmt-row{grid-template-columns:repeat(3,1fr);}
    .gstats b{font-size:22px;}
  }
  .fmt-row{grid-template-columns:repeat(3,1fr);}

<script>
"use strict";
const KEY='folioNovelStudio_v1';
const PIG={clay:'#9E5236',ochre:'#B08744',moss:'#67714F',indigo:'#39424F',mulberry:'#6D4650',umber:'#55402C',graphite:'#8B7E6B'};
const LABELS=[['clay','Scene'],['umber','Chapter'],['indigo','Character'],['moss','Setting'],['ochre','Research'],['mulberry','Idea'],['graphite','None']];
const STATUS=['To Do','In Progress','First Draft','Revised','Final'];
const uid=()=>Math.random().toString(36).slice(2,10);
const pig=l=>PIG[l]||PIG.graphite;
const labelName=l=>{const f=LABELS.find(x=>x[0]===l);return f?f[1]:'None';};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------------- state ----------------
let DB={projects:[]};
let cur=null;                // current project object
let view='editor', scriv=false, selId=null, inspectorOn=true;

function syncConfigured(){ const c=window.FOLIO_FIREBASE||{}; return !!(c.apiKey && c.projectId && !/^PASTE/i.test(c.apiKey) && !/^PASTE/i.test(c.projectId)); }
function notify(msg,ms){ const t=document.getElementById('toast'); if(!t)return; t.textContent=msg; t.classList.add('show'); clearTimeout(window._toastT); window._toastT=setTimeout(()=>t.classList.remove('show'),ms||4600); }
// persistLocal writes the whole library to this device. save() = notice any edits (for sync) + persistLocal + nudge sync.
function persistLocal(){
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); return true; }
  catch(e){ console.error('save failed',e);
    if(!window._warnedStorage){ window._warnedStorage=true; notify('This device has run out of storage space, so your latest changes may not be kept here. Download an archive, or sign in so sync keeps them safe.',9000); }
    return false; }
}
function save(){ try{ Sync.scan(); }catch(e){ console.error('sync scan',e); } persistLocal(); try{ Sync.afterSave(); }catch(e){ console.error('sync after',e); } }
function load(){
  try{ const r=localStorage.getItem(KEY); if(r) DB=JSON.parse(r); }
  catch(e){ console.error('load failed',e); try{ localStorage.setItem(KEY+'_unreadable_'+Date.now(), localStorage.getItem(KEY)); }catch(_){} DB={projects:[]}; }
  if(!DB||typeof DB!=='object') DB={projects:[]};
  if(!Array.isArray(DB.projects)) DB.projects=[];
  if(!Array.isArray(DB.purgeProjects)) DB.purgeProjects=[];
  if(!DB.snaps||typeof DB.snaps!=='object'||Array.isArray(DB.snaps)) DB.snaps={};
  DB.projects.forEach(p=>{ if(!Array.isArray(p.binder))p.binder=[]; if(!Array.isArray(p.trash))p.trash=[]; });
}

function newDoc(name,opts={}){ return Object.assign({id:uid(),type:'doc',name:name||'Untitled',label:'clay',status:'To Do',synopsis:'',notes:'',content:'',keywords:[],target:1500},opts); }
function newFolder(name,opts={}){ return Object.assign({id:uid(),type:'folder',name:name||'New Folder',label:'umber',open:true,children:[]},opts); }

function seedDemo(){
  const p={
    id:uid(), title:'Ashes of Kano', author:'Basil', subtitle:'a novel', kind:'Novel',
    cover:{mode:'type', image:null, cloth:'clay'},
    createdAt:Date.now(), updatedAt:Date.now(),
    trash:[],
    binder:[
      newFolder('Part One — The City',{label:'clay',children:[
        newDoc('Kano, 1983',{label:'clay',status:'Revised',synopsis:'Amina returns to the compound the morning after the fire.',content:'<p>The morning after the fire, the compound smelled of nothing else, and Amina stood at the gate for a long time before she went in.</p><p>She had rehearsed this on the bus from Lagos — what she would feel, which of the rooms she would enter first. None of it survived the smell.</p>'}),
        newDoc('The Marketplace',{label:'ochre',status:'First Draft',synopsis:'A walk through the market that used to be her father’s.',content:'<p>The market opened whether or not the world had ended.</p>'}),
        newDoc('Letters Home',{label:'moss',status:'In Progress',synopsis:'Three unsent letters, each to a person now gone.',content:''}),
      ]}),
      newFolder('Part Two — The Fire',{label:'mulberry',open:false,children:[
        newDoc('Smoke',{label:'mulberry',synopsis:'The night itself, told out of order.',content:''}),
        newDoc('What the Ash Remembers',{label:'indigo',synopsis:'Closing movement. She keeps one brick.',content:''}),
      ]}),
      newFolder('Research',{label:'ochre',role:'research',open:false,children:[newFolder('Characters',{label:'indigo',open:false,children:[
        newDoc('Amina',{label:'indigo',status:'Final',synopsis:'34. Archivist. Believes memory is a duty, not a comfort.',content:''}),
      ]}),
        newDoc('Kano fire — timeline',{label:'ochre',status:'Final',synopsis:'What is public record vs. what the novel invents.',content:''}),
      ]}),
    ]
  };
  DB.projects.push(p); save();
}

// ---------------- tree helpers ----------------
function walk(nodes,fn,depth=0,parent=null){ for(const n of nodes){ fn(n,depth,parent,nodes); if(n.children) walk(n.children,fn,depth+1,n); } }
function findNode(id,nodes){ nodes=nodes||cur.binder; for(const n of nodes){ if(n.id===id)return n; if(n.children){const f=findNode(id,n.children); if(f)return f;} } return null; }
function locate(id,nodes,parent){ nodes=nodes||cur.binder; for(let i=0;i<nodes.length;i++){ const n=nodes[i]; if(n.id===id) return {arr:nodes,index:i,parent:parent||null,node:n}; if(n.children){ const r=locate(id,n.children,n); if(r)return r; } } return null; }
function words(html){ const t=(html||'').replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').trim(); return t?t.split(/\s+/).filter(w=>/[\p{L}\p{N}]/u.test(w)).length:0; }
function nodeWords(n){ if(n.type==='doc')return words(n.content); return (n.children||[]).reduce((s,c)=>s+nodeWords(c),0); }
function manuscriptWords(){ return cur.binder.reduce((s,n)=>s+(n.role==='research'?0:nodeWords(n)),0); }

// ---------------- screens ----------------
let showDeleted=false;
function renderLibrary(){
  const live=DB.projects.filter(p=>!p.deleted), gone=DB.projects.filter(p=>p.deleted);
  const hour=new Date().getHours();
  const greet=hour<12?'Good morning.':hour<18?'Good afternoon.':'Good evening.';
  document.getElementById('libGreeting').textContent = live.length? greet+' Your novels.' : 'Every novel begins with a blank cover.';
  const shelf=document.getElementById('shelf'); shelf.innerHTML='';
  live.forEach(p=>{
    const el=document.createElement('div'); el.className='novel';
    el.innerHTML=coverHTML(p,'cover')+
      '<button class="novel-x" title="Delete this novel" aria-label="Delete '+esc(p.title||'Untitled')+'">✕</button>'+
      '<div class="novel-meta"><div class="nm">'+esc(p.title||'Untitled')+'</div><div class="wc">'+projWords(p).toLocaleString()+' words</div></div>';
    el.onclick=(e)=>{ if(e.target.closest('.novel-x')){ e.stopPropagation(); askDeleteProject(p.id); return; } openProject(p.id); };
    shelf.appendChild(el);
  });
  const add=document.createElement('div'); add.className='novel new-novel';
  add.innerHTML='<div class="cover"><span class="plus">＋</span></div><div class="novel-meta"><div class="nm" style="color:var(--graphite);font-style:italic;">a new novel</div></div>';
  add.onclick=newNovel; shelf.appendChild(add);
  renderDeletedZone(gone);
  try{ Sync.updateUI(); }catch(e){}
}
function renderDeletedZone(gone){
  const z=document.getElementById('deletedZone'); if(!z)return;
  if(!gone.length){ z.innerHTML=''; return; }
  let h='<div class="rd"><div class="rd-head">Recently deleted · '+gone.length+'<button onclick="toggleDeleted()">'+(showDeleted?'hide':'show')+'</button></div>';
  if(showDeleted){ gone.forEach(p=>{ h+='<div class="rd-row"><span class="t">'+esc(p.title||'Untitled')+'</span><span class="w">'+projWords(p).toLocaleString()+' words</span><button onclick="restoreProject(\''+esc(p.id)+'\')">restore</button><button class="danger" onclick="askPurgeProject(\''+esc(p.id)+'\')">delete forever</button></div>'; }); }
  z.innerHTML=h+'</div>';
}
function toggleDeleted(){ showDeleted=!showDeleted; renderLibrary(); }

// ---- confirm dialog (one in-room pattern for every destructive action) ----
function closeConfirm(){ ['delDialog','delVeil'].forEach(id=>{ const e=document.getElementById(id); if(e)e.remove(); }); }
function confirmBox(o){
  closeConfirm();
  const v=document.createElement('div'); v.className='cbox-veil'; v.id='delVeil'; v.onclick=closeConfirm;
  const d=document.createElement('div'); d.id='delDialog'; d.className='confirm-delete'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true');
  d.innerHTML='<h3></h3><p></p><div class="actions"><button class="cancel"></button><button class="delete"></button></div>';
  d.querySelector('h3').textContent=o.title; d.querySelector('p').textContent=o.text;
  const c=d.querySelector('.cancel'), k=d.querySelector('.delete'); c.textContent=o.cancel||'Keep it'; k.textContent=o.ok||'Delete';
  c.onclick=closeConfirm; k.onclick=()=>{ closeConfirm(); try{ if(o.onOk)o.onOk(); }catch(e){ console.error(e); } };
  document.body.appendChild(v); document.body.appendChild(d);
}

// ---- deleting whole novels ----
function projById(id){ return DB.projects.find(x=>x.id===id)||null; }
function askDeleteProject(id){ const p=projById(id); if(!p)return;
  confirmBox({title:'Delete this novel?', text:'“'+(p.title||'Untitled')+'” will move to “Recently deleted” at the bottom of the shelf. You can restore it from there.', ok:'Delete', onOk:()=>deleteProject(id)}); }
function deleteProject(id){ const p=projById(id); if(!p)return; p.deleted=true; p.deletedAt=Date.now();
  flushPendingSave(); const wasOpen=(cur===p); if(wasOpen) cur=null; save(); if(wasOpen) show('library'); renderLibrary(); notify('Moved to “Recently deleted”.'); }
function restoreProject(id){ const p=projById(id); if(!p)return; p.deleted=false; delete p.deletedAt; save(); renderLibrary(); }
function askPurgeProject(id){ const p=projById(id); if(!p)return;
  confirmBox({title:'Delete forever?', text:'“'+(p.title||'Untitled')+'” and everything in it will be erased from this device and from the cloud. This cannot be undone.', ok:'Delete forever', onOk:()=>purgeProject(id)}); }
function purgeProject(id){ const i=DB.projects.findIndex(x=>x.id===id); if(i<0)return; const [p]=DB.projects.splice(i,1); dropSnapsFor(id);
  try{ Sync.notePurgeProject(p); }catch(e){ console.error(e); } save(); renderLibrary(); }
function projWords(p){ return p.binder.reduce((s,n)=>s+(n.role==='research'?0:nodeWords(n)),0); }
function coverHTML(p,cls){
  const c=p.cover||{mode:'type',cloth:'clay'};
  if(c.mode==='image' && c.image){
    return '<div class="'+cls+' imgcov" style="background-image:url('+c.image+')"><div class="cov-inner"><div class="cov-top"></div>'+
      '<div class="cov-title">'+esc(p.title||'Untitled')+'</div><div class="cov-rule"></div><div class="cov-author">'+esc(p.author||'')+'</div></div></div>';
  }
  const g='linear-gradient(150deg, '+pig(c.cloth)+', '+shade(pig(c.cloth),-24)+')';
  return '<div class="'+cls+'" style="background:'+g+'"><div class="cov-inner"><div class="cov-top"><div class="cov-title">'+esc(p.title||'Untitled')+'</div></div>'+
    '<div class="cov-rule"></div><div class="cov-author">'+esc(p.author||'')+'</div></div></div>';
}
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt; r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b)); return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0'); }

function openProject(id){ const p=DB.projects.find(p=>p.id===id); if(!p||p.deleted)return; cur=p; if(!cur.trash)cur.trash=[]; try{ baseline(); }catch(e){} selId=firstDoc(cur.binder); view='editor'; scriv=false; closeDrawers(); show('workspace'); renderWorkspace(); }
function firstDoc(nodes){ for(const n of nodes){ if(n.type==='doc')return n.id; if(n.children){const f=firstDoc(n.children); if(f)return f;} } return nodes[0]?nodes[0].id:null; }
function toLibrary(){ flushPendingSave(); save(); show('library'); renderLibrary(); }
function show(which){ ['threshold','library','workspace'].forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==which)); }

function newNovel(){
  const p={id:uid(),title:'Untitled Novel',author:'',subtitle:'a novel',kind:'Novel',cover:{mode:'type',image:null,cloth:'indigo'},createdAt:Date.now(),updatedAt:Date.now(),trash:[],
    binder:[ newFolder('Manuscript',{label:'umber',children:[ newDoc('Chapter One',{label:'clay',synopsis:'',content:''}) ]}) ]};
  DB.projects.push(p); save(); openProject(p.id); openCover();
}

// ---------------- workspace ----------------
function renderWorkspace(){ document.getElementById('wsTitle').textContent=cur.title||'Untitled'; renderBinder(); renderCenter(); renderInspector(); syncToggle(); }

function renderBinder(){
  // cover item
  const ci=document.getElementById('coverItem');
  ci.className='cover-item'+(view==='cover'?' sel':'');
  ci.innerHTML=coverThumb(cur)+'<div><div class="ci-txt">'+esc(cur.title||'Untitled')+'</div><div class="ci-sub">cover &amp; title page</div></div>';
  // tree
  const host=document.getElementById('tree'); host.innerHTML='';
  function draw(nodes,depth){
    nodes.forEach(n=>{
      const isF=n.type==='folder';
      const row=document.createElement('div');
      row.className='row'+(isF?' folder':'')+(n.open?' open':'')+(n.id===selId?' sel':'');
      row.style.paddingLeft=(6+depth*15)+'px';
      row.setAttribute('draggable','true'); row.dataset.id=n.id;
      row.innerHTML=
        '<span class="tw">'+(isF&&n.children&&n.children.length?'▶':'')+'</span>'+
        '<span class="ic">'+(isF?'▤':'▢')+'</span>'+
        '<span class="dot" style="background:'+pig(n.label)+'"></span>'+
        '<span class="nm">'+esc(n.name)+'</span>'+
        '<span class="ct">'+(isF?(n.children?n.children.length:0):(nodeWords(n)||'·'))+'</span>'+
        '<span class="mv"><button title="up" data-mv="up">▲</button><button title="down" data-mv="dn">▼</button><button title="delete" data-del="'+n.id+'">✕</button></span>';
      row.onclick=(e)=>{
        if(e.target.dataset.del){ e.stopPropagation(); confirmDelete(n); return; }
        if(e.target.dataset.mv){ e.stopPropagation(); moveNode(n.id, e.target.dataset.mv==='up'?-1:1); return; }
        if(isF && e.offsetX < (20+depth*15)){ n.open=!n.open; save(); renderBinder(); return; }
        selId=n.id; if(isF && view==='editor'){ view='corkboard'; } if(isMobile())closeBinder(); renderWorkspace();
      };
      row.ondblclick=(e)=>{ if(e.target.dataset.mv)return; startRename(row,n); };
      attachDrag(row,n);
      host.appendChild(row);
      if(isF && n.open && n.children) draw(n.children,depth+1);
    });
  }
  draw(cur.binder,0);
  document.getElementById('binderTotal').textContent=manuscriptWords().toLocaleString()+' words';
  renderTrash(); try{ renderGoalLine(); }catch(e){}
}
function coverThumb(p){
  const c=p.cover||{mode:'type',cloth:'clay'};
  if(c.mode==='image'&&c.image) return '<div class="cover-thumb" style="background-image:url('+c.image+')"></div>';
  return '<div class="cover-thumb" style="background:linear-gradient(150deg,'+pig(c.cloth)+','+shade(pig(c.cloth),-24)+')"><div class="mini">'+esc((p.title||'').split(' ').slice(0,3).join(' '))+'</div></div>';
}
function renderTrash(){
  const z=document.getElementById('trashZone');
  if(!cur.trash||!cur.trash.length){ z.innerHTML=''; return; }
  let h='<div class="trash-head"><span>Trash · '+cur.trash.length+'</span><button onclick="askEmptyTrash()">empty</button></div>';
  cur.trash.forEach(n=>{
    h+='<div class="row" style="padding-left:12px;opacity:.75"><span class="ic">'+(n.type==='folder'?'▤':'▢')+'</span><span class="nm">'+esc(n.name)+'</span>'+
       '<span class="mv" style="display:flex"><button title="restore" onclick="restoreNode(\''+n.id+'\')">↩</button></span></div>';
  });
  z.innerHTML=h;
}
function startRename(row,n){
  const nm=row.querySelector('.nm'); const inp=document.createElement('input'); inp.className='rename'; inp.value=n.name;
  nm.replaceWith(inp); inp.focus(); inp.select();
  const done=()=>{ n.name=inp.value.trim()||n.name; save(); renderWorkspace(); };
  inp.onblur=done; inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){inp.value=n.name;inp.blur();} };
}

// ---- binder CRUD ----
function addNode(kind){
  const node = kind==='folder'? newFolder('New Folder') : newDoc('Untitled');
  let sel = selId?locate(selId):null;
  if(sel && sel.node.type==='folder'){ sel.node.children=sel.node.children||[]; sel.node.children.push(node); sel.node.open=true; }
  else if(sel){ sel.arr.splice(sel.index+1,0,node); }
  else cur.binder.push(node);
  selId=node.id; save(); renderWorkspace();
}
function moveNode(id,dir){
  const l=locate(id); if(!l)return; const j=l.index+dir;
  if(j<0||j>=l.arr.length)return;
  const [x]=l.arr.splice(l.index,1); l.arr.splice(j,0,x); save(); renderBinder();
}
function deleteNode(id){
  const l=locate(id); if(!l)return; const [x]=l.arr.splice(l.index,1); cur.trash.unshift(x);
  if(selId===id) selId=firstDoc(cur.binder);
  save(); renderWorkspace();
}
function restoreNode(id){
  const i=cur.trash.findIndex(n=>n.id===id); if(i<0)return; const [x]=cur.trash.splice(i,1); cur.binder.push(x); save(); renderWorkspace();
}
function askEmptyTrash(){ if(!cur||!cur.trash||!cur.trash.length)return;
  confirmBox({title:'Empty the trash?', text:'Everything in the trash will be erased for good — on this device and on every device you sync. This cannot be undone.', ok:'Empty trash', onOk:emptyTrash}); }
function emptyTrash(){
  const ids=[]; (function grab(ns){ (ns||[]).forEach(n=>{ if(n.type==='doc'){ if((n.pu||0)>0) ids.push(n.id); } else grab(n.children); }); })(cur.trash);
  try{ Sync.notePurgeNodes(cur,ids); }catch(e){ console.error(e); }
  cur.trash=[]; save(); renderBinder();
}
function confirmDelete(n){
  const isF=n.type==='folder';
  confirmBox({title:'Delete this '+(isF?'folder':'document')+'?', text:'“'+n.name+'”'+(isF?' and everything inside it':'')+' will move to the trash. You can restore it from there.', ok:'Delete', onOk:()=>deleteNode(n.id)});
}
function reallyDelete(id){ closeConfirm(); deleteNode(id); }

// ---- drag reorder (same-level or into folder) ----
let dragId=null;
function attachDrag(row,n){
  row.addEventListener('dragstart',e=>{ dragId=n.id; e.dataTransfer.effectAllowed='move'; });
  row.addEventListener('dragover',e=>{ e.preventDefault(); row.classList.remove('drop-above','drop-in');
    if(n.type==='folder' && e.offsetX>30) row.classList.add('drop-in'); else row.classList.add('drop-above'); });
  row.addEventListener('dragleave',()=>row.classList.remove('drop-above','drop-in'));
  row.addEventListener('drop',e=>{ e.preventDefault(); const into=row.classList.contains('drop-in'); row.classList.remove('drop-above','drop-in');
    if(!dragId||dragId===n.id)return; doDrop(dragId,n.id,into); });
}
function doDrop(fromId,toId,into){
  const fl=locate(fromId); if(!fl)return; const target=findNode(toId);
  // guard: don't drop a folder into its own descendant
  if(fl.node.children && findNode(toId, fl.node.children)) return;
  const [moved]=fl.arr.splice(fl.index,1);
  if(into && target.type==='folder'){ target.children=target.children||[]; target.children.push(moved); target.open=true; }
  else { const tl=locate(toId); tl.arr.splice(tl.index,0,moved); }
  save(); renderBinder();
}

// Covers are shrunk before they are stored: a phone photo can be 5 MB+, which would swamp both this device's storage and the cloud.
function shrinkImage(dataUrl,maxSide,quality,cb){
  const img=new Image();
  img.onload=()=>{ try{
      let w=img.width,h=img.height; const s=Math.min(1,maxSide/Math.max(w,h)); w=Math.max(1,Math.round(w*s)); h=Math.max(1,Math.round(h*s));
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; const cx=cv.getContext('2d'); cx.fillStyle='#ffffff'; cx.fillRect(0,0,w,h); cx.drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',quality)); }catch(e){ cb(null); } };
  img.onerror=()=>cb(null); img.src=dataUrl;
}
document.getElementById('coverFile').addEventListener('change',function(){
  const f=this.files&&this.files[0]; if(!f)return; const rd=new FileReader();
  rd.onload=()=>{
    shrinkImage(rd.result,1000,0.82,out=>{
      if(out && out.length>600000) return shrinkImage(rd.result,700,0.7,out2=>finish(out2));
      finish(out);
    });
    function finish(out){
      if(!out||out.length>650000){ notify('That image couldn’t be used. Try a smaller JPEG or PNG.'); return; }
      cur.cover.image=out; cur.cover.mode='image'; save(); renderCover();
    }
  };
  rd.readAsDataURL(f); this.value='';
});

// Debounced saves, with a guaranteed flush when the page is hidden (phones freeze background tabs — a pending timer would never fire).
let pendingSaveFn=null;
function queueSave(fn,ms){ pendingSaveFn=fn; clearTimeout(window._save); window._save=setTimeout(()=>{ const f=pendingSaveFn; pendingSaveFn=null; if(f)f(); },ms); }
function flushPendingSave(){ clearTimeout(window._save); const f=pendingSaveFn; pendingSaveFn=null; if(f){ try{ f(); }catch(e){ console.error(e); } } }
function dropPendingSave(){ clearTimeout(window._save); pendingSaveFn=null; }

window.addEventListener('pagehide',flushPendingSave);
function showKept(){ const k=document.getElementById('kept'); if(!k)return; const t=new Date(); k.textContent='kept · '+String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0'); k.classList.add('show'); clearTimeout(window._k); window._k=setTimeout(()=>k.classList.remove('show'),2400); }

// ---- import: bring in an archive made by "archive everything" (from any earlier version, on any device) ----
// Nothing is ever overwritten: a novel whose id already exists arrives as a separate copy.
function safeId(s){ return (typeof s==='string' && /^[A-Za-z0-9_-]{1,64}$/.test(s)) ? s : null; }
function reIdNodes(nodes,seen){ (nodes||[]).forEach(n=>{ if(!n||typeof n!=='object')return; n.id=uid(); if(Array.isArray(n.children)) reIdNodes(n.children); }); }
function cleanNodes(nodes){
  return (Array.isArray(nodes)?nodes:[]).filter(n=>n&&typeof n==='object'&&(n.type==='doc'||n.type==='folder')).map(n=>{
    n.id=safeId(n.id)||uid(); delete n.cu; delete n.pu; n.name=String(n.name==null?'Untitled':n.name);
    if(n.role!=='research') delete n.role; if(Array.isArray(n.refs)) n.refs=n.refs.filter(x=>safeId(x)); else delete n.refs;
    if(n.type==='folder'){ n.children=cleanNodes(n.children); if(n.open===undefined)n.open=true; }
    else { n.content=typeof n.content==='string'?n.content:''; n.keywords=Array.isArray(n.keywords)?n.keywords.map(String):[]; delete n.children; }
    return n; });
}
function importProjects(data){
  const list=Array.isArray(data)?data:(data&&Array.isArray(data.projects)?data.projects:null);
  if(!list) throw new Error('no projects');
  let added=0;
  list.forEach(src=>{
    if(!src||typeof src!=='object'||!Array.isArray(src.binder)) return;
    const p=JSON.parse(JSON.stringify(src));
    ['tu','pushedTu','purge','deleted','deletedAt'].forEach(k=>delete p[k]); if(p.goals&&typeof p.goals==='object') p.goals={novel:+p.goals.novel||0,daily:+p.goals.daily||0,by:/^\d{4}-\d{2}-\d{2}$/.test(p.goals.by||'')?p.goals.by:''}; else delete p.goals; if(!p.log||typeof p.log!=='object'||Array.isArray(p.log)) delete p.log;
    p.binder=cleanNodes(p.binder); p.trash=cleanNodes(p.trash);
    p.title=String(p.title==null?'Untitled':p.title); p.author=String(p.author==null?'':p.author); p.subtitle=String(p.subtitle==null?'':p.subtitle);
    p.cover=(p.cover&&typeof p.cover==='object')?p.cover:{mode:'type',cloth:'clay',image:null};
    if(!p.createdAt) p.createdAt=Date.now();
    const sid=safeId(p.id);
    let keepIds=true;
    if(!sid || DB.projects.some(x=>x.id===sid)){ p.id=uid(); reIdNodes(p.binder); reIdNodes(p.trash); keepIds=false; if(sid) p.title=p.title+' (imported)'; } else p.id=sid;
    if(!keepIds) walk(p.binder,n=>{ delete n.refs; });

function doCompile(fmt,roots,opt){

// ---- intermediate representation ----
function isSceneMark(t){ return /^(\*\s*){3,}$/.test(t)||/^(#|◆|⁂|•\s*•\s*•|-\s*-\s*-|~\s*~\s*~)$/.test(t); }
function buildIR(roots,opt){
  opt=opt||{}; const ir=[];
  if(opt.titlePage) ir.push({kind:'title',title:cur.title||'Untitled',author:cur.author||'',subtitle:cur.subtitle||'',words:0});
  (function walk(nodes,level){
    let prevDoc=false;
    (nodes||[]).forEach(n=>{
      if(!n) return;
      if(n.type==='folder'){
        if(!(level===1&&/^manuscript$/i.test(String(n.name||'').trim()))) ir.push({kind:'heading',level:Math.min(level,3),text:n.name,part:level===1,chapter:level===2});
        prevDoc=false; walk(n.children,level+1);
      } else {
        if(opt.titles) ir.push({kind:'heading',level:Math.min(level,4),text:n.name,part:false,chapter:level===2});
        else if(prevDoc) ir.push({kind:'break'});
        const ps=htmlToParas(n.content);
        ps.forEach(p=>{ const t=p.map(r=>r.text).join('').trim(); if(isSceneMark(t)) ir.push({kind:'break'}); else ir.push({kind:'para',runs:p}); });
        if(!ps.length) (ir.empty=ir.empty||[]).push(n.name);
        prevDoc=true;
      }
    });
  })(roots,1);
  const wc=ir.reduce((s,x)=>s+(x.kind==='para'?x.runs.reduce((a,r)=>a+r.text.split(/\s+/).filter(Boolean).length,0):0),0);
  if(ir[0]&&ir[0].kind==='title') ir[0].words=wc;
  return ir;
}
// A heading starts a new page when asked to — but never when it directly follows another heading, or opens the book.
function needsBreak(ir,i,opt){
  const x=ir[i]; if(x.kind!=='heading') return false;
  if(!((opt.breaks&&x.part)||(opt.chapterBreaks&&x.chapter))) return false;
  for(let j=i-1;j>=0;j--){ const k=ir[j].kind; if(k==='title') return false; return k!=='heading'; }
  return false;
}
function surname(a){ const p=String(a||'').trim().split(/\s+/); return p.length?p[p.length-1]:''; }
function htmlToParas(html){
  if(!html||!String(html).trim()) return [];
  let root;
  try{ root=new DOMParser().parseFromString('<div id="r">'+html+'</div>','text/html').getElementById('r'); }
  catch(e){ return String(html).replace(/<[^>]+>/g,' ').split(/\n+/).filter(x=>x.trim()).map(t=>[{text:t,bold:false,italic:false}]); }
  // Typing in a page produces MIXED content: loose text first, then <div>/<p> after each Enter. Walk everything so no line is dropped.
  const BLOCK=/^(P|DIV|H[1-6]|BLOCKQUOTE|LI|UL|OL|PRE|SECTION|ARTICLE|TABLE|TBODY|THEAD|TR|TD|TH|FIGURE|FIGCAPTION|HEADER|FOOTER)$/;
  const hasBlock=(el)=>!!el.querySelector('p,div,h1,h2,h3,h4,h5,h6,blockquote,li,ul,ol,pre,section,article,table,tr,td,th,figure');
  const paras=[]; let loose=[];

    const out=[]; let line=[];

    out.push(line); loose=[];

    node.childNodes.forEach(ch=>{
      if(ch.nodeType===3){ if(ch.textContent) loose.push({text:ch.textContent,bold:false,italic:false}); return; }
      if(ch.nodeType!==1) return;
      const t=ch.tagName;

      if(t==='BR'){ loose.push({text:'\n',bold:false,italic:false}); return; }
      if(t==='HR'){ flushLoose(); return; }
      if(BLOCK.test(t)){
        flushLoose();

        else { const runs=[]; inlineRuns(ch,false,false,runs); const m=mergeRuns(runs); if(m.some(r=>r.text.trim())) paras.push(m); }

      }

    });

}
function inlineRuns(node,bold,italic,out){

}
function mergeRuns(runs){ const out=[]; runs.forEach(r=>{ const l=out[out.length-1]; if(l&&l.bold===r.bold&&l.italic===r.italic) l.text+=r.text; else out.push({text:r.text,bold:r.bold,italic:r.italic}); }); return out; }

// ---- markdown ----
function runsMD(runs){ return runs.map(r=>{ let t=r.text.replace(/\n/g,' '); if(r.bold)t='**'+t+'**'; if(r.italic)t='*'+t+'*'; return t; }).join(''); }

  if(x.kind==='title') o+='# '+x.title+'\n\n'+(x.subtitle?'*'+x.subtitle+'*\n\n':'')+(x.author?'by '+x.author+'\n\n':'')+'---\n\n';

// ---- plain text ----
function renderTXT(ir,opt){ const mk=(opt&&MARKS[opt.mark]!==undefined)?MARKS[opt.mark]:'*  *  *'; let o=''; ir.forEach(x=>{

// ---- html / pdf ----
function runsHTML(runs){ return runs.map(r=>{ let t=esc(r.text).replace(/\n/g,'<br>'); if(r.bold)t='<strong>'+t+'</strong>'; if(r.italic)t='<em>'+t+'</em>'; return t; }).join(''); }

function renderHTMLDoc(ir,opt,forPrint){

  if(ms) css+="body{font-family:'Times New Roman',Times,serif;font-size:12pt;line-height:2;max-width:none;padding:0;color:#000;} h1,h2,h3,h4{font-family:inherit;color:#000;font-size:12pt;font-weight:bold;font-style:normal;margin:0 0 2em;} h2{margin-top:0;}"+
    "p{margin:0;text-indent:.5in;} .sb{color:#000;margin:1em 0;letter-spacing:.2em;} .tp{padding:0;text-align:center;} .ms-top{display:flex;justify-content:space-between;text-align:left;margin-bottom:28vh;} .ms-top .r{text-align:right;} .tt{font-size:14pt;margin:0 0 .6em;} .ts{font-size:12pt;color:#000;} .ta{font-size:12pt;color:#000;margin-top:1em;}";

function printPDF(html){

// ---- real .docx (inline STORE zip, no dependencies) ----
function xesc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

const W_PAGE='<w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/>';
function docxBody(ir,opt){
  opt=opt||{}; const ms=opt.layout==='manuscript'; const mk=MARKS[opt.mark]!==undefined?MARKS[opt.mark]:MARKS.orn;

    if(it.kind==='title'){
      if(ms){
        x+='<w:p><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr><w:r><w:t xml:space="preserve">'+xesc(it.author||'')+'</w:t></w:r></w:p>';
        x+='<w:p><w:pPr><w:jc w:val="right"/><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr><w:r><w:t xml:space="preserve">about '+Math.max(100,Math.round(it.words/100)*100).toLocaleString('en-GB')+' words</w:t></w:r></w:p>';
        x+='<w:p><w:pPr><w:pStyle w:val="Title"/></w:pPr><w:r><w:t xml:space="preserve">'+xesc((it.title||'').toUpperCase())+'</w:t></w:r></w:p>';
      } else x+='<w:p><w:pPr><w:pStyle w:val="Title"/></w:pPr><w:r><w:t xml:space="preserve">'+xesc(it.title)+'</w:t></w:r></w:p>';
      if(it.subtitle) x+='<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:i/></w:rPr><w:t xml:space="preserve">'+xesc(it.subtitle)+'</w:t></w:r></w:p>';
      if(it.author) x+='<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:before="240"/></w:pPr><w:r><w:t xml:space="preserve">by '+xesc(it.author)+'</w:t></w:r></w:p>';

      x+='<w:p><w:pPr><w:spacing w:after="0"/><w:sectPr>'+W_PAGE+'</w:sectPr></w:pPr></w:p>';
    } else if(it.kind==='heading'){
      const hs='Heading'+Math.min(it.level,3);

      x+='<w:p><w:pPr><w:pStyle w:val="'+hs+'"/>'+pb+'</w:pPr><w:r><w:t xml:space="preserve">'+xesc(it.text)+'</w:t></w:r></w:p>';
    } else if(it.kind==='break'){

function buildDocx(ir,opt){

    textNodesOf(root).forEach(tn=>{ const t=tn.nodeValue; matchesIn(t,q,opt.cs,opt.ww).forEach(m=>{ count++;
      if(snips.length<5) snips.push({k:count-1,before:t.slice(Math.max(0,m.i-40),m.i),hit:t.slice(m.i,m.i+m.len),after:t.slice(m.i+m.len,m.i+m.len+60)}); }); });

function replaceInDoc(n,q,r,opt){

// ================= SNAPSHOTS (kept on this device) =================
const SNAP_PER_DOC=14, SNAP_TOTAL_CHARS=1000000;
function snapKey(n){ return cur.id+'/'+n.id; }
function snapList(n){ return (DB.snaps&&DB.snaps[snapKey(n)])||[]; }
function takeSnapshot(n,label,auto){
  const c=n.content||''; if(!c.trim()) return null;
  if(!DB.snaps) DB.snaps={}; const k=snapKey(n); const arr=DB.snaps[k]=DB.snaps[k]||[];
  if(arr[0]&&arr[0].c===c){ if(!auto){ arr[0].a=false; if(label) arr[0].l=label; persistLocal(); } return arr[0]; }
  arr.unshift({t:Date.now(),l:label||'',a:!!auto,c,w:words(c)});
  while(arr.length>SNAP_PER_DOC){ let i=-1; for(let j=arr.length-1;j>=0;j--){ if(arr[j].a){ i=j; break; } } arr.splice(i>=0?i:arr.length-1,1); }
  trimSnaps(); persistLocal(); return arr[0];
}
function trimSnaps(){
  let total=0; const all=[]; Object.keys(DB.snaps||{}).forEach(k=>DB.snaps[k].forEach(s=>{ total+=s.c.length; all.push([k,s]); }));
  if(total<=SNAP_TOTAL_CHARS) return;
  all.sort((a,b)=>a[1].t-b[1].t); const order=all.filter(x=>x[1].a).concat(all.filter(x=>!x[1].a));
  for(const [k,s] of order){ if(total<=SNAP_TOTAL_CHARS)break; const arr=DB.snaps[k]; const i=arr?arr.indexOf(s):-1; if(i>=0){ arr.splice(i,1); total-=s.c.length; if(!arr.length) delete DB.snaps[k]; } }
}
function dropSnapsFor(pid){ if(!DB.snaps) return; Object.keys(DB.snaps).forEach(k=>{ if(k.indexOf(pid+'/')===0) delete DB.snaps[k]; }); }
function autoSnapIfNeeded(n){   // once a day, the first time you change a page, keep how it stood before
  try{ const old=n.content||''; if(words(old)<30) return; const day=new Date().toDateString();
    if(snapList(n).some(s=>s.a&&s.l==='Start of day'&&new Date(s.t).toDateString()===day)) return; takeSnapshot(n,'Start of day',true); }catch(e){}
}
function snapWhen(t){ const d=new Date(t); const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; return d.getDate()+' '+mon[d.getMonth()]+', '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function paraTexts(html){ return htmlToParas(html).map(p=>p.map(r=>r.text).join('').replace(/\s+/g,' ').trim()).filter(Boolean); }
function diffParas(a,b){
  let s=0; while(s<a.length&&s<b.length&&a[s]===b[s]) s++;
  let ea=a.length,eb=b.length; while(ea>s&&eb>s&&a[ea-1]===b[eb-1]){ ea--; eb--; }
  const head=a.slice(0,s).map(x=>({t:'=',x})), tail=a.slice(ea).map(x=>({t:'=',x}));
  const A=a.slice(s,ea), B=b.slice(s,eb); let mid=[];
  if(A.length*B.length>360000){ mid=A.map(x=>({t:'-',x})).concat(B.map(x=>({t:'+',x}))); }
  else {
    const n=A.length,m=B.length, w=m+1, L=new Uint16Array((n+1)*(m+1));
    for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i*w+j]=A[i]===B[j]?L[(i+1)*w+j+1]+1:Math.max(L[(i+1)*w+j],L[i*w+j+1]);
    let i=0,j=0; while(i<n&&j<m){ if(A[i]===B[j]){ mid.push({t:'=',x:A[i]}); i++; j++; } else if(L[(i+1)*w+j]>=L[i*w+j+1]){ mid.push({t:'-',x:A[i++]}); } else { mid.push({t:'+',x:B[j++]}); } }
    while(i<n) mid.push({t:'-',x:A[i++]}); while(j<m) mid.push({t:'+',x:B[j++]});
  }
  return head.concat(mid,tail);
}
function closeSnapView(){ const v=document.getElementById('snapVeil'); if(v){ v.classList.remove('show'); setTimeout(()=>v.remove(),240); } }
function openSnapshot(nid,i){
  const n=findNode(nid); if(!n)return; const sn=snapList(n)[i]; if(!sn)return;
  const ops=diffParas(paraTexts(sn.c),paraTexts(n.content||''));
  const add=ops.filter(o=>o.t==='+').reduce((s,o)=>s+o.x.split(/\s+/).length,0), del=ops.filter(o=>o.t==='-').reduce((s,o)=>s+o.x.split(/\s+/).length,0);

function deleteSnapshot(nid,i){ const n=findNode(nid); if(!n)return; const arr=snapList(n); arr.splice(i,1); if(!arr.length) delete DB.snaps[snapKey(n)]; persistLocal(); renderInspector(); }

// ================= WRITING GOALS =================
function dayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function goalsOf(p){ const g=(p&&p.goals)||{}; return {novel:+g.novel||0,daily:+g.daily||0,by:String(g.by||'')}; }
function pruneLog(p){ const ks=Object.keys(p.log||{}).sort(); while(ks.length>400) delete p.log[ks.shift()]; }
function baseline(){      // first sight of a new day: remember where the book stood, so "today" counts only today's words
  if(!cur) return; const k=dayKey(); const total=manuscriptWords(); cur.log=cur.log||{}; if(!cur.log[k]) cur.lastTotal=total;
}
function touchProgress(now){
  if(!cur) return; now=now||new Date(); const k=dayKey(now); const total=manuscriptWords(); const log=cur.log=cur.log||{};
  if(!log[k]) log[k]={b:(typeof cur.lastTotal==='number'?cur.lastTotal:total),n:total}; else log[k].n=total;
  cur.lastTotal=total; pruneLog(cur); renderGoalLine();
}
function todayWords(p,now){ const e=(p.log||{})[dayKey(now||new Date())]; return e?Math.max(0,e.n-e.b):0; }
function streakOf(p,now){
  const log=p.log||{}; const d=new Date(now||new Date()); d.setHours(12,0,0,0); let n=0;
  const wrote=(dt)=>{ const e=log[dayKey(dt)]; return !!e&&e.n-e.b>0; };
  if(!wrote(d)) d.setDate(d.getDate()-1);
  while(wrote(d)&&n<400){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function lastDays(p,n,now){ const out=[]; const d=new Date(now||new Date()); d.setHours(12,0,0,0); d.setDate(d.getDate()-(n-1)); for(let i=0;i<n;i++){ const e=(p.log||{})[dayKey(d)]; out.push({k:dayKey(d),w:e?Math.max(0,e.n-e.b):0,dow:'SMTWTFS'[d.getDay()]}); d.setDate(d.getDate()+1); } return out; }
function daysUntil(by,now){ if(!/^\d{4}-\d{2}-\d{2}$/.test(by||''))return null; const a=new Date(now||new Date()); a.setHours(0,0,0,0); const b=new Date(by+'T00:00:00'); return Math.round((b-a)/86400000); }
function renderGoalLine(){
  const el=document.getElementById('goalLine'); if(!el||!cur) return; const g=goalsOf(cur); const t=todayWords(cur), total=manuscriptWords(), st=streakOf(cur);
  if(!g.novel&&!g.daily){ el.innerHTML='<span class="gl-set">set a writing goal</span>'; return; }
  const pct=g.daily?Math.min(100,Math.round(t/g.daily*100)):(g.novel?Math.min(100,Math.round(total/g.novel*100)):0);
  el.innerHTML='<div class="gl-bar"><div class="gl-fill" style="width:'+pct+'%"></div></div><div class="gl-txt"><span>today '+t.toLocaleString()+(g.daily?' / '+g.daily.toLocaleString():'')+'</span><span>'+(st?st+'-day streak':(g.novel?total.toLocaleString()+' / '+g.novel.toLocaleString():''))+'</span></div>';
}
function closeGoals(){ const v=document.getElementById('goalsVeil'); if(v){ v.classList.remove('show'); setTimeout(()=>v.remove(),240); } }
function openGoals(){
  if(!cur){ notify('Open a novel first.'); return; } const old=document.getElementById('goalsVeil'); if(old)old.remove();
  const g=goalsOf(cur), total=manuscriptWords(), t=todayWords(cur), st=streakOf(cur), days=lastDays(cur,14), mx=Math.max(1,...days.map(d=>d.w),g.daily||0);
  const left=Math.max(0,g.novel-total), dl=daysUntil(g.by); const pace=(g.novel&&dl!==null)?(dl>0?Math.ceil(left/dl):(left?left:0)):null;
  const v=document.createElement('div'); v.className='veil'; v.id='goalsVeil';
  v.innerHTML='<div class="modal" role="dialog" aria-modal="true"><h2>Writing goals</h2><div class="sub">“'+esc(cur.title||'Untitled')+'”</div>'+
    '<div class="gstats"><div><b>'+t.toLocaleString()+'</b><span>words today</span></div><div><b>'+st+'</b><span>day streak</span></div><div><b>'+total.toLocaleString()+'</b><span>in the manuscript</span></div></div>'+
    '<div class="gchart">'+days.map(d=>'<div class="gb" title="'+d.k+': '+d.w+' words"><div class="gbar" style="height:'+Math.round(d.w/mx*100)+'%"></div><span>'+d.dow+'</span></div>').join('')+'</div>'+
    '<div class="field"><label>Whole novel — target words</label><input type="text" id="gNovel" inputmode="numeric" value="'+(g.novel||'')+'" placeholder="e.g. 80000"></div>'+
    '<div class="field"><label>Each day — target words</label><input type="text" id="gDaily" inputmode="numeric" value="'+(g.daily||'')+'" placeholder="e.g. 500"></div>'+
    '<div class="field"><label>Finish by (optional)</label><input type="date" id="gBy" value="'+esc(g.by)+'"></div>'+
    '<div class="compile-note" id="gPace">'+(pace!==null?(dl>0?(left?'To finish by then: about '+pace.toLocaleString()+' words a day ('+left.toLocaleString()+' to go, '+dl+' day'+(dl===1?'':'s')+').':'You have reached the target.'):(left?'That date has passed — '+left.toLocaleString()+' words to go.':'You have reached the target.')):'Set a target and a date and I’ll work out the daily pace.')+'</div>'+
    '<div class="compile-note">Today counts words added since you first opened this novel today on this device. Targets sync across your devices.</div>'+
    '<div class="modal-actions"><button class="cancel" onclick="closeGoals()">close</button><button class="go" id="gSave">Save</button></div></div>';
  document.body.appendChild(v); requestAnimationFrame(()=>v.classList.add('show')); v.addEventListener('click',e=>{ if(e.target===v)closeGoals(); });
  document.getElementById('gSave').onclick=()=>{ const num=id=>Math.max(0,parseInt(String(document.getElementById(id).value).replace(/[^\d]/g,''),10)||0);
    setGoals({novel:num('gNovel'),daily:num('gDaily'),by:document.getElementById('gBy').value||''}); closeGoals(); notify('Goals saved.'); };
}
function setGoals(g){ cur.goals={novel:Math.min(+g.novel||0,5000000),daily:Math.min(+g.daily||0,200000),by:/^\d{4}-\d{2}-\d{2}$/.test(g.by||'')?g.by:''}; save(); renderGoalLine(); }

const TEMPLATES={
  character:{label:'indigo',sub:'Characters',name:'New character',html:['Name','Age','Role in the story','Looks','Voice and habits','What they want','What they fear','Their secret','How they change'].map(h=>'<p><b>'+h+':</b> </p>').join('')},
  place:{label:'moss',sub:'Places',name:'New place',html:['Name','Where it is','What it looks, sounds and smells like','Who belongs here','Why it matters to the story'].map(h=>'<p><b>'+h+':</b> </p>').join('')},
  note:{label:'ochre',sub:'Notes',name:'New research note',html:'<p></p>'}

function ensureResearch(){
  let r=cur.binder.find(n=>n.type==='folder'&&n.role==='research');
  if(!r){ r=newFolder('Research & Notes',{label:'ochre',role:'research',children:[newFolder('Characters',{label:'indigo'}),newFolder('Places',{label:'moss'}),newFolder('Notes',{label:'ochre'})]}); cur.binder.push(r); }
  return r;
}
function researchSub(r,name,label){ let f=(r.children||[]).find(n=>n.type==='folder'&&n.name===name); if(!f){ f=newFolder(name,{label}); r.children.push(f); } return f; }
function addResearchDoc(kind){
  const T=TEMPLATES[kind]; if(!T||!cur) return null; const r=ensureResearch(), f=researchSub(r,T.sub,T.label); r.open=true; f.open=true;
  const d=newDoc(T.name,{label:T.label,status:'To Do',content:T.html,target:300}); f.children.push(d);
  selId=d.id; view='editor'; scriv=false; save(); if(isMobile())closeDrawers(); renderWorkspace(); return d;
}
function templateMenu(ev){
  closeMenu(); const m=document.createElement('div'); m.className='menu'; m.id='popmenu'; m.setAttribute('data-menu','1');
  m.innerHTML='<button data-t="character">Character sheet</button><button data-t="place">Place / setting sheet</button><button data-t="note">Research note</button>';
  document.body.appendChild(m); const b=ev.currentTarget.getBoundingClientRect(); const r=m.getBoundingClientRect(); m.style.left=Math.max(8,Math.min(b.left,innerWidth-r.width-8))+'px'; m.style.top=(b.bottom+6)+'px';
  m.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{ closeMenu(); addResearchDoc(bt.dataset.t); });
}
function researchDocs(){ const out=[]; (cur.binder||[]).filter(n=>n.role==='research').forEach(r=>{ (function go(ns,path){ ns.forEach(n=>{ if(n.type==='folder') go(n.children||[],path.concat(n.name)); else out.push({n,path:path.join(' › ')}); }); })(r.children||[],[]); }); return out; }
function backlinks(id){ const out=[]; walk(cur.binder,n=>{ if(n.type==='doc'&&Array.isArray(n.refs)&&n.refs.includes(id)) out.push(n); }); return out; }
function linksSectionHTML(n){ return '<div class="insec"><div class="ilbl">Linked notes</div><div class="chips" id="iRefs"></div><div class="chips" id="iBack" style="margin-top:8px"></div></div>'; }
function renderRefs(n){
  const box=document.getElementById('iRefs'); if(!box)return; n.refs=Array.isArray(n.refs)?n.refs:[];
  const live=n.refs.map(id=>findNode(id)).filter(Boolean);
  box.innerHTML=live.map(x=>'<span class="chip link" data-go="'+esc(x.id)+'">'+esc(x.name)+'<span class="x" data-unref="'+esc(x.id)+'">✕</span></span>').join('')+'<span class="chip add" id="addRef" data-menu="1">＋ link a note</span>';
  box.querySelectorAll('[data-go]').forEach(el=>el.onclick=e=>{ if(e.target.dataset.unref)return; selId=el.dataset.go; view='editor'; scriv=false; renderWorkspace(); });
  box.querySelectorAll('[data-unref]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); n.refs=n.refs.filter(x=>x!==el.dataset.unref); save(); renderRefs(n); });
  document.getElementById('addRef').onclick=ev=>{
    const docs=researchDocs().filter(x=>x.n.id!==n.id&&!n.refs.includes(x.n.id)); closeMenu();
    if(!docs.length){ notify('No notes to link yet. Use ✦ in the binder to add a character, place or note.'); return; }
    const m=document.createElement('div'); m.className='menu'; m.id='popmenu'; m.setAttribute('data-menu','1'); m.style.maxHeight='60vh'; m.style.overflow='auto';
    m.innerHTML=docs.map((x,i)=>'<button data-i="'+i+'">'+esc(x.n.name)+(x.path?'<span class="meta"> · '+esc(x.path)+'</span>':'')+'</button>').join('');
    document.body.appendChild(m); const b=ev.currentTarget.getBoundingClientRect(); const r=m.getBoundingClientRect(); m.style.left=Math.max(8,Math.min(b.left,innerWidth-r.width-8))+'px'; m.style.top=Math.max(8,Math.min(b.bottom+6,innerHeight-r.height-8))+'px';
    m.querySelectorAll('button').forEach(bt=>bt.onclick=()=>{ const x=docs[+bt.dataset.i]; closeMenu(); n.refs.push(x.n.id); save(); renderRefs(n); });
  };
  const back=document.getElementById('iBack'); const bl=backlinks(n.id);
  back.innerHTML=bl.length?'<span class="tnote" style="width:100%">Mentioned in</span>'+bl.map(x=>'<span class="chip link" data-go2="'+esc(x.id)+'">'+esc(x.name)+'</span>').join(''):'';
  back.querySelectorAll('[data-go2]').forEach(el=>el.onclick=()=>{ selId=el.dataset.go2; view='editor'; scriv=false; renderWorkspace(); });
}

function boot(){
  load(); applyTheme(getTheme());
  if(!DB.projects.length && !syncConfigured()) seedDemo();      // with sync on, a fresh device waits for your library instead of inventing a second sample
  Sync.boot();
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ closeConfirm(); try{ Sync.closeAccount(); }catch(_){} try{ closeCompile(); }catch(_){} try{ closeSearch(); }catch(_){} try{ closeGoals(); }catch(_){} try{ closeSnapView(); }catch(_){} try{ closeMenu(); }catch(_){} if(document.body.classList.contains('focus')) exitFocus(); }
    if((e.metaKey||e.ctrlKey)&&e.shiftKey&&(e.key==='f'||e.key==='F')){ e.preventDefault(); if(cur&&!document.getElementById('workspace').classList.contains('hidden')) openSearch(); }
  });
  const now=new Date(); const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday']; const mon=['January','February','March','April','May','June','July','August','September','October','November','December'];
  document.getElementById('thDate').textContent=days[now.getDay()]+' · '+now.getDate()+' '+mon[now.getMonth()];
  renderLibrary();
  const th=document.getElementById('threshold');
  const enter=()=>{ th.classList.add('gone'); setTimeout(()=>{ show('library'); try{ Sync.maybePrompt(); }catch(e){} },700); };
  th.addEventListener('click',enter); setTimeout(()=>{ if(!th.classList.contains('gone')) enter(); },4200);
}
boot();

<script type="module">
/* Loads Firebase from Google's CDN after the page is already usable. If it can't load (offline, blocked), the app simply keeps working on this device. */
(async()=>{
  try{
    if(!window.Sync || !window.Sync.canLoad()) return;
    const base='https://www.gstatic.com/firebasejs/12.19.0/';
    const [appM,authM,fsM]=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
    window.Sync.attach({appM,authM,fsM});
  }catch(e){ console.error('Firebase could not be loaded',e); if(window.Sync) window.Sync.loadFailed(e); }
})();
</script>
