<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FolioOS</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Space+Grotesk:wght@300;400;500;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #0f0d0a;
    --deep: #1a1612;
    --bark: #2c2318;
    --kente-gold: #c8922a;
    --dusty-amber: #e8b86d;
    --palm-green: #3d5a3e;
    --terracotta: #b5533c;
    --cream: #f5efe6;
    --parchment: #ede3d4;
    --smoke: #8c7d6e;
    --ghost: #4a3f35;
  }
  body {
    background: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    color: var(--cream);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 52px;
    background: var(--deep);
    border-bottom: 1px solid var(--ghost);
    flex-shrink: 0;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--kente-gold);
    letter-spacing: 0.04em;
  }
  .logo span { color: var(--cream); font-weight: 400; font-style: italic; }
  .nav-tabs { display: flex; gap: 4px; }
  .nav-tab {
    padding: 6px 18px;
    border-radius: 4px;
    font-size: 13px;
    font-weight: 500;
    color: var(--smoke);
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
    background: transparent;
    border: none;
    font-family: 'Space Grotesk', sans-serif;
  }
  .nav-tab:hover { color: var(--cream); background: var(--ghost); }
  .nav-tab.active { color: var(--ink); background: var(--kente-gold); }
  .new-btn {
    background: var(--terracotta);
    color: var(--cream);
    border: none;
    padding: 7px 16px;
    border-radius: 4px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    letter-spacing: 0.04em;
    transition: all 0.2s;
  }
  .new-btn:hover { background: #c85f44; }
  .main { display: flex; flex: 1; overflow: hidden; }
  .shelf-view {
    flex: 1;
    overflow-y: auto;
    padding: 36px 40px;
    display: flex;
    flex-direction: column;
    gap: 40px;
  }
  .shelf-view::-webkit-scrollbar { width: 4px; }
  .shelf-view::-webkit-scrollbar-thumb { background: var(--ghost); border-radius: 2px; }
  .shelf-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--ghost);
    padding-bottom: 16px;
  }
  .shelf-title {
    font-family: 'Playfair Display', serif;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--smoke);
  }
  .shelf-count { font-size: 12px; color: var(--ghost); letter-spacing: 0.06em; }
  .book-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 28px 20px;
    margin-top: 20px;
  }
  .book-item {
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transition: transform 0.2s;
  }
  .book-item:hover { transform: translateY(-4px); }
  .book-item:hover .book-cover { box-shadow: 0 16px 40px rgba(0,0,0,0.7), 4px 4px 0 var(--kente-gold); }
  .book-cover {
    width: 100%;
    aspect-ratio: 2/3;
    border-radius: 3px 6px 6px 3px;
    position: relative;
    overflow: hidden;
    box-shadow: 4px 4px 20px rgba(0,0,0,0.6), inset -3px 0 8px rgba(0,0,0,0.4);
    transition: box-shadow 0.25s;
  }
  .book-cover::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 10px;
    background: rgba(0,0,0,0.3);
    z-index: 2;
  }
  .book-1 { background: linear-gradient(160deg, #8b1a1a 0%, #2d0a0a 100%); }
  .book-1 .bp { position:absolute;inset:0; background-image: repeating-linear-gradient(45deg, rgba(200,146,42,0.12) 0px, rgba(200,146,42,0.12) 1px, transparent 1px, transparent 12px); }
  .book-2 { background: linear-gradient(160deg, #0d2d4a 0%, #051824 100%); }
  .book-2 .bp { position:absolute;inset:0; background-image: radial-gradient(circle at 30% 40%, rgba(100,180,255,0.1) 0%, transparent 50%); }
  .book-3 { background: linear-gradient(160deg, #2d4a1e 0%, #0d1a08 100%); }
  .book-3 .bp { position:absolute;inset:0; background-image: repeating-linear-gradient(0deg, rgba(200,146,42,0.08) 0px, rgba(200,146,42,0.08) 1px, transparent 1px, transparent 8px); }
  .book-4 { background: linear-gradient(160deg, #4a3010 0%, #1a0f05 100%); }
  .book-4 .bp { position:absolute;inset:0; background-image: repeating-linear-gradient(135deg, rgba(232,184,109,0.1) 0px, rgba(232,184,109,0.1) 1px, transparent 1px, transparent 10px); }
  .book-5 { background: linear-gradient(160deg, #3a1a4a 0%, #12081a 100%); }
  .book-5 .bp { position:absolute;inset:0; background-image: radial-gradient(circle at 60% 30%, rgba(180,100,255,0.12) 0%, transparent 50%); }
  .book-new { background: var(--deep); border: 1.5px dashed var(--ghost); display:flex; align-items:center; justify-content:center; }
  .book-new-icon { font-size: 28px; color: var(--ghost); }
  .book-title-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 24px 10px 10px;
    background: linear-gradient(transparent, rgba(0,0,0,0.8));
    z-index: 3;
  }
  .book-title-text {
    font-family: 'Playfair Display', serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--cream);
    line-height: 1.3;
  }
  .book-status { display:flex; align-items:center; gap:5px; font-size:10px; font-weight:500; letter-spacing:0.08em; text-transform:uppercase; }
  .book-status .dot { width:5px; height:5px; border-radius:50%; }
  .status-writing .dot { background: var(--kente-gold); }
  .status-writing { color: var(--kente-gold); }
  .status-draft .dot { background: var(--smoke); }
  .status-draft { color: var(--smoke); }
  .status-complete .dot { background: #6baa6d; }
  .status-complete { color: #6baa6d; }
  .book-word-count { font-size: 10px; color: var(--ghost); margin-top: 2px; }
  .shelf-wood { height:8px; background:linear-gradient(180deg,#3d2a14 0%,#2c1e0c 100%); border-top:2px solid #5a3d1e; margin-top:4px; margin-bottom:8px; border-radius:0 0 2px 2px; }
  .editor-view { flex:1; display:flex; overflow:hidden; }
  .editor-sidebar {
    width: 200px;
    background: var(--deep);
    border-right: 1px solid var(--ghost);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow-y: auto;
  }
  .editor-sidebar::-webkit-scrollbar { display: none; }
  .sidebar-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--ghost); }
  .sidebar-book-title { font-family:'Playfair Display',serif; font-size:14px; font-weight:700; color:var(--cream); line-height:1.3; margin-bottom:4px; }
  .sidebar-meta { font-size:10px; color:var(--smoke); letter-spacing:0.06em; text-transform:uppercase; }
  .chapter-list { padding: 12px 0; flex: 1; }
  .chapter-section-label { font-size:9px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:var(--ghost); padding:8px 16px 4px; }
  .chapter-item { display:flex; align-items:center; gap:8px; padding:8px 16px; cursor:pointer; transition:background 0.15s; border-left:2px solid transparent; }
  .chapter-item:hover { background: var(--bark); }
  .chapter-item.active { background:var(--bark); border-left-color:var(--kente-gold); }
  .chapter-num { font-size:9px; color:var(--ghost); letter-spacing:0.06em; min-width:18px; }
  .chapter-name { font-size:12px; color:var(--cream); line-height:1.3; flex:1; }
  .chapter-item.active .chapter-name { color: var(--dusty-amber); }
  .chapter-words { font-size:9px; color:var(--ghost); }
  .add-chapter-btn { display:flex; align-items:center; gap:8px; padding:8px 16px; cursor:pointer; color:var(--ghost); transition:all 0.15s; font-size:12px; }
  .add-chapter-btn:hover { background:var(--bark); color:var(--cream); }
  .sidebar-footer { padding:12px 16px; border-top:1px solid var(--ghost); }
  .progress-label { display:flex; justify-content:space-between; font-size:10px; color:var(--smoke); margin-bottom:6px; }
  .progress-bar { height:3px; background:var(--ghost); border-radius:2px; overflow:hidden; }
  .progress-fill { height:100%; background:linear-gradient(90deg,var(--kente-gold),var(--dusty-amber)); width:22%; border-radius:2px; }
  .writing-pane { flex:1; display:flex; flex-direction:column; background:#131008; overflow:hidden; }
  .writing-toolbar { display:flex; align-items:center; gap:6px; padding:10px 20px; border-bottom:1px solid var(--ghost); background:var(--deep); flex-shrink:0; }
  .toolbar-btn { background:transparent; border:none; color:var(--smoke); font-size:12px; font-family:'Space Grotesk',sans-serif; padding:4px 8px; border-radius:3px; cursor:pointer; font-weight:500; transition:all 0.15s; }
  .toolbar-btn:hover { background:var(--ghost); color:var(--cream); }
  .toolbar-btn.tbactive { color:var(--kente-gold); }
  .toolbar-sep { width:1px; height:16px; background:var(--ghost); margin:0 4px; }
  .writing-area { flex:1; padding:48px 56px; overflow-y:auto; position:relative; }
  .writing-area::-webkit-scrollbar { width:4px; }
  .writing-area::-webkit-scrollbar-thumb { background:var(--ghost); border-radius:2px; }
  .chapter-heading-edit { font-family:'Playfair Display',serif; font-size:28px; font-weight:700; color:var(--cream); margin-bottom:8px; border:none; background:transparent; width:100%; outline:none; letter-spacing:-0.01em; }
  .chapter-heading-edit::placeholder { color:var(--ghost); }
  .chapter-sub { font-size:11px; color:var(--smoke); letter-spacing:0.1em; text-transform:uppercase; margin-bottom:36px; display:flex; align-items:center; gap:12px; }
  .chapter-sub::after { content:''; flex:1; height:1px; background:var(--ghost); }
  .writing-content { font-family:'Crimson Pro',serif; font-size:18px; line-height:1.85; color:var(--parchment); border:none; background:transparent; width:100%; min-height:300px; resize:none; outline:none; letter-spacing:0.01em; }
  .writing-content::placeholder { color:var(--ghost); font-style:italic; }
  .word-counter { position:absolute; bottom:20px; right:28px; font-size:11px; color:var(--ghost); letter-spacing:0.06em; }
  .preview-pane { width:280px; background:var(--parchment); border-left:1px solid #c8b89a; display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; }
  .preview-header { display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-bottom:1px solid #c8b89a; background:#e8ddc8; }
  .preview-label { font-size:9px; font-weight:600; letter-spacing:0.14em; text-transform:uppercase; color:#8c7560; }
  .preview-page-num { font-size:10px; color:#a08060; font-family:'Crimson Pro',serif; font-style:italic; }
  .preview-book { flex:1; overflow-y:auto; padding:32px 24px; background:var(--parchment); position:relative; }
  .preview-book::-webkit-scrollbar { display:none; }
  .preview-chapter-num { font-family:'Playfair Display',serif; font-size:9px; font-weight:400; letter-spacing:0.2em; text-transform:uppercase; color:#a08060; text-align:center; margin-bottom:16px; }
  .preview-chapter-title { font-family:'Playfair Display',serif; font-size:17px; font-weight:700; color:#2c1a0a; text-align:center; line-height:1.3; margin-bottom:8px; }
  .preview-divider { display:flex; align-items:center; gap:8px; margin:16px 0 20px; }
  .preview-divider::before,.preview-divider::after { content:''; flex:1; height:0.5px; background:#b89878; }
  .preview-divider-diamond { width:6px; height:6px; background:var(--kente-gold); transform:rotate(45deg); flex-shrink:0; }
  .preview-text { font-family:'Crimson Pro',serif; font-size:12.5px; line-height:1.9; color:#2c1a0a; text-align:justify; }
  .preview-text p { margin-bottom:10px; }
  .preview-text p:first-child::first-letter { font-family:'Playfair Display',serif; font-size:40px; font-weight:900; float:left; line-height:0.8; margin:4px 6px 0 0; color:var(--terracotta); }
  .preview-cursor { display:inline-block; width:1.5px; height:12px; background:var(--terracotta); animation:blink 1.1s step-end infinite; vertical-align:text-bottom; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
  .preview-footer { display:flex; align-items:center; justify-content:center; padding:10px; border-top:0.5px solid #c8b89a; background:#e8ddc8; gap:6px; }
  .preview-page-dot { width:4px; height:4px; border-radius:50%; background:#b89878; }
  .preview-page-dot.pdactive { background:var(--terracotta); }
  .hidden { display: none !important; }
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
  .modal { background: var(--deep); border: 1px solid var(--ghost); border-radius: 6px; padding: 24px; max-width: 400px; width: 90%; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 700; color: var(--cream); margin-bottom: 16px; }
  .modal-input { width: 100%; padding: 10px 12px; background: var(--bark); border: 1px solid var(--ghost); color: var(--cream); font-family: 'Space Grotesk', sans-serif; font-size: 14px; border-radius: 4px; margin-bottom: 16px; }
  .modal-input::placeholder { color: var(--ghost); }
  .modal-buttons { display: flex; gap: 12px; justify-content: flex-end; }
  .modal-btn { padding: 8px 16px; border: none; border-radius: 4px; font-family: 'Space Grotesk', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
  .modal-btn-cancel { background: var(--bark); color: var(--cream); }
  .modal-btn-cancel:hover { background: var(--ghost); }
  .modal-btn-confirm { background: var(--kente-gold); color: var(--ink); }
  .modal-btn-confirm:hover { background: var(--dusty-amber); }
</style>
</head>
<body>
<div class="topbar">
  <div class="logo">folio<span>OS</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" id="tabShelf" onclick="showView('shelf')">My Shelf</button>
    <button class="nav-tab" id="tabEditor" onclick="showView('editor')">Editor</button>
  </div>
  <div>
    <button class="new-btn" onclick="openNewWorkModal()">+ New Work</button>
  </div>
</div>
<div class="main">
  <div class="shelf-view" id="shelfView">
    <div id="activeWorksSection"></div>
    <div id="completedWorksSection"></div>
  </div>
  <div class="editor-view hidden" id="editorView">
    <div class="editor-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-book-title" id="sidebarTitle">Select a work</div>
        <div class="sidebar-meta" id="sidebarMeta"></div>
      </div>
      <div class="chapter-list" id="chapterList"></div>
      <div class="sidebar-footer">
        <div class="progress-label"><span>Progress</span><span id="progressText">0 / 0</span></div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
      </div>
    </div>
    <div class="writing-pane">
      <div class="writing-toolbar">
        <button class="toolbar-btn tbactive">B</button>
        <button class="toolbar-btn" style="font-style:italic">I</button>
        <button class="toolbar-btn" style="text-decoration:underline">U</button>
        <div class="toolbar-sep"></div>
        <button class="toolbar-btn">H1</button>
        <button class="toolbar-btn">H2</button>
        <button class="toolbar-btn">¶</button>
        <div class="toolbar-sep"></div>
        <button class="toolbar-btn" style="margin-left:auto;color:var(--kente-gold)">AI Feedback</button>
      </div>
      <div class="writing-area">
        <input class="chapter-heading-edit" id="chapterTitle" placeholder="Chapter title" oninput="syncPreviewAndSave()">
        <div class="chapter-sub"><span id="chapterSubText">Chapter 01</span></div>
        <textarea class="writing-content" id="writingArea" placeholder="Start writing..." oninput="syncPreviewAndSave()"></textarea>
        <div class="word-counter" id="wordCounter">0 words</div>
      </div>
    </div>
    <div class="preview-pane">
      <div class="preview-header">
        <div class="preview-label">Live Preview</div>
        <div class="preview-page-num" id="pageNum">Page 1</div>
      </div>
      <div class="preview-book">
        <div class="preview-chapter-num" id="previewChapNum">Chapter</div>
        <div class="preview-chapter-title" id="previewTitle">Title</div>
        <div class="preview-divider"><div class="preview-divider-diamond"></div></div>
        <div class="preview-text" id="previewText"><p><span class="preview-cursor"></span></p></div>
      </div>
      <div class="preview-footer"><div class="preview-page-dot pdactive"></div></div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="newWorkModal">
  <div class="modal">
    <div class="modal-title">New Work</div>
    <input class="modal-input" id="workTitleInput" placeholder="Title of your work" />
    <input class="modal-input" id="workGenreInput" placeholder="Genre (e.g., Fiction, Essay)" />
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-cancel" onclick="closeNewWorkModal()">Cancel</button>
      <button class="modal-btn modal-btn-confirm" onclick="createNewWork()">Create</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="newChapterModal">
  <div class="modal">
    <div class="modal-title">New Chapter</div>
    <input class="modal-input" id="chapterTitleInput" placeholder="Chapter title" />
    <div class="modal-buttons">
      <button class="modal-btn modal-btn-cancel" onclick="closeNewChapterModal()">Cancel</button>
      <button class="modal-btn modal-btn-confirm" onclick="createNewChapter()">Create</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'folioOS_data';

  function getStorage() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (!data) return initializeDefaultData();
    return JSON.parse(data);
  }

  function saveStorage(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }

  function initializeDefaultData() {
    const defaultData = {
      works: [
        { id: 1, title: 'Ashes of Kano', genre: 'Fiction', status: 'writing', bookClass: 'book-1', chapters: [{ id: 1, title: 'Chapter One: The Road North', content: 'The harmattan came early that year, coating everything in Kano with a fine red dust that tasted of the Sahara. Amara pressed her face against the bus window and watched the minarets recede behind a gauze of heat and particulate, already uncertain whether she was leaving or being expelled.\n\nShe had not told anyone she was going. Not her mother, who would have wept. Not Dele, who would have laughed. Certainly not the man in the grey kaftan who had handed her the envelope three weeks ago on Ahmadu Bello Way, as though passing salt across a table.' }, { id: 2, title: 'Chapter Two: Dust and Memory', content: '' }, { id: 3, title: 'Chapter Three: The Market', content: '' }] },
        { id: 2, title: 'Lagos Blue', genre: 'Fiction', status: 'writing', bookClass: 'book-2', chapters: [{ id: 1, title: 'Chapter One: Awakening', content: '' }] },
        { id: 3, title: 'Iroko', genre: 'Essay', status: 'draft', bookClass: 'book-3', chapters: [{ id: 1, title: 'The Tree and Its Meaning', content: '' }] },
        { id: 4, title: 'The Compound', genre: 'Novel', status: 'complete', bookClass: 'book-4', chapters: [{ id: 1, title: 'Prologue', content: '' }] },
        { id: 5, title: 'Nameless', genre: 'Poetry', status: 'complete', bookClass: 'book-5', chapters: [{ id: 1, title: 'Collection', content: '' }] }
      ],
      currentWorkId: 1,
      currentChapterId: 1
    };
    saveStorage(defaultData);
    return defaultData;
  }

  function showView(view) {
    const shelf = document.getElementById('shelfView');
    const editor = document.getElementById('editorView');
    const t1 = document.getElementById('tabShelf');
    const t2 = document.getElementById('tabEditor');
    if (view === 'shelf') {
      shelf.classList.remove('hidden');
      editor.classList.add('hidden');
      t1.classList.add('active');
      t2.classList.remove('active');
      renderShelf();
    } else {
      shelf.classList.add('hidden');
      editor.classList.remove('hidden');
      t1.classList.remove('active');
      t2.classList.add('active');
      loadEditor();
    }
  }

  function renderShelf() {
    const data = getStorage();
    const activeWorks = data.works.filter(w => w.status === 'writing' || w.status === 'draft');
    const completedWorks = data.works.filter(w => w.status === 'complete');

    let activeHtml = '<div><div class="shelf-header"><div class="shelf-title">Active Works</div><div class="shelf-count">' + activeWorks.length + ' in progress</div></div><div class="book-grid">';
    activeWorks.forEach(work => {
      const wordCount = work.chapters.reduce((sum, ch) => sum + (ch.content ? ch.content.split(/\s+/).length : 0), 0);
      activeHtml += '<div class="book-item" onclick="selectWork(' + work.id + ')"><div class="book-cover ' + work.bookClass + '"><div class="bp"></div><div class="book-title-overlay"><div class="book-title-text">' + work.title + '</div></div></div><div class="book-status status-' + work.status + '"><div class="dot"></div> ' + (work.status.charAt(0).toUpperCase() + work.status.slice(1)) + '</div><div class="book-word-count">' + wordCount.toLocaleString() + ' words</div></div>';
    });
    activeHtml += '<div class="book-item" onclick="openNewWorkModal()"><div class="book-cover book-new"><div class="book-new-icon">+</div></div><div class="book-status status-draft"><div class="dot" style="opacity:0"></div></div><div class="book-word-count" style="color:var(--ghost)">Start writing</div></div></div><div class="shelf-wood"></div></div>';

    let completedHtml = '<div><div class="shelf-header"><div class="shelf-title">Completed</div><div class="shelf-count">' + completedWorks.length + ' works</div></div><div class="book-grid">';
    completedWorks.forEach(work => {
      const wordCount = work.chapters.reduce((sum, ch) => sum + (ch.content ? ch.content.split(/\s+/).length : 0), 0);
      completedHtml += '<div class="book-item" onclick="selectWork(' + work.id + ')"><div class="book-cover ' + work.bookClass + '"><div class="bp"></div><div class="book-title-overlay"><div class="book-title-text">' + work.title + '</div></div></div><div class="book-status status-complete"><div class="dot"></div> Complete</div><div class="book-word-count">' + wordCount.toLocaleString() + ' words</div></div>';
    });
    completedHtml += '</div><div class="shelf-wood"></div></div>';

    document.getElementById('activeWorksSection').innerHTML = activeHtml;
    document.getElementById('completedWorksSection').innerHTML = completedWorks.length > 0 ? completedHtml : '';
  }

  function selectWork(workId) {
    const data = getStorage();
    data.currentWorkId = workId;
    data.currentChapterId = data.works.find(w => w.id === workId).chapters[0].id;
    saveStorage(data);
    showView('editor');
  }

  function loadEditor() {
    const data = getStorage();
    const work = data.works.find(w => w.id === data.currentWorkId);
    if (!work) return;
    const chapter = work.chapters.find(ch => ch.id === data.currentChapterId) || work.chapters[0];
    document.getElementById('sidebarTitle').textContent = work.title;
    document.getElementById('sidebarMeta').textContent = work.genre + ' · ' + work.status;
    renderChapterList(work, chapter);
    loadChapter(chapter);
  }

  function renderChapterList(work, activeChapter) {
    let html = '<div class="chapter-section-label">Chapters</div>';
    work.chapters.forEach((ch, idx) => {
      const isActive = ch.id === activeChapter.id ? 'active' : '';
      const wordCount = ch.content ? ch.content.split(/\s+/).length : 0;
      html += '<div class="chapter-item ' + isActive + '" onclick="switchChapter(' + ch.id + ')"><div class="chapter-num">' + (idx + 1).toString().padStart(2, '0') + '</div><div class="chapter-name">' + ch.title + '</div><div class="chapter-words">' + (wordCount ? wordCount.toLocaleString() : '—') + '</div></div>';
    });
    html += '<div class="add-chapter-btn" onclick="openNewChapterModal()">+ Add chapter</div>';
    document.getElementById('chapterList').innerHTML = html;
  }

  function loadChapter(chapter) {
    const data = getStorage();
    const work = data.works.find(w => w.id === data.currentWorkId);
    const chapterIndex = work.chapters.findIndex(ch => ch.id === chapter.id) + 1;
    document.getElementById('chapterTitle').value = chapter.title;
    document.getElementById('writingArea').value = chapter.content || '';
    document.getElementById('chapterSubText').textContent = 'Chapter ' + chapterIndex.toString().padStart(2, '0');
    const totalWords = work.chapters.reduce((sum, ch) => sum + (ch.content ? ch.content.split(/\s+/).length : 0), 0);
    const targetWords = 50000;
    document.getElementById('progressText').textContent = totalWords.toLocaleString() + ' / ' + targetWords.toLocaleString();
    document.querySelector('.progress-fill').style.width = Math.min(100, (totalWords / targetWords) * 100) + '%';
    syncPreviewAndSave();
  }

  function switchChapter(chapterId) {
    const data = getStorage();
    data.currentChapterId = chapterId;
    saveStorage(data);
    loadEditor();
  }

  function syncPreviewAndSave() {
    const data = getStorage();
    const work = data.works.find(w => w.id === data.currentWorkId);
    const chapter = work.chapters.find(ch => ch.id === data.currentChapterId);
    const titleVal = document.getElementById('chapterTitle').value;
    const bodyVal = document.getElementById('writingArea').value;
    chapter.title = titleVal;
    chapter.content = bodyVal;
    saveStorage(data);
    const parts = titleVal.split(':');
    const displayTitle = parts.length > 1 ? parts[1].trim() : titleVal;
    document.getElementById('previewTitle').textContent = displayTitle;
    const paragraphs = bodyVal.split(/\n\n+/).filter(p => p.trim());
    const previewText = document.getElementById('previewText');
    if (paragraphs.length > 0) {
      previewText.innerHTML = paragraphs.map((p, i) => '<p>' + p.trim() + (i === paragraphs.length - 1 ? '<span class="preview-cursor"></span>' : '') + '</p>').join('');
    } else {
      previewText.innerHTML = '<p><span class="preview-cursor"></span></p>';
    }
    const words = bodyVal.trim() ? bodyVal.trim().split(/\s+/).length : 0;
    document.getElementById('wordCounter').textContent = words + ' words';
  }

  function openNewWorkModal() {
    document.getElementById('newWorkModal').classList.remove('hidden');
    document.getElementById('workTitleInput').focus();
  }

  function closeNewWorkModal() {
    document.getElementById('newWorkModal').classList.add('hidden');
  }

  function createNewWork() {
    const title = document.getElementById('workTitleInput').value.trim();
    const genre = document.getElementById('workGenreInput').value.trim() || 'Untitled';
    if (!title) return;
    const data = getStorage();
    const newId = Math.max(...data.works.map(w => w.id), 0) + 1;
    const bookClasses = ['book-1', 'book-2', 'book-3', 'book-4', 'book-5'];
    const bookClass = bookClasses[(newId - 1) % bookClasses.length];
    data.works.push({ id: newId, title: title, genre: genre, status: 'draft', bookClass: bookClass, chapters: [{ id: 1, title: 'Chapter One', content: '' }] });
    data.currentWorkId = newId;
    data.currentChapterId = 1;
    saveStorage(data);
    closeNewWorkModal();
    document.getElementById('workTitleInput').value = '';
    document.getElementById('workGenreInput').value = '';
    renderShelf();
    showView('editor');
  }

  function openNewChapterModal() {
    document.getElementById('newChapterModal').classList.remove('hidden');
    document.getElementById('chapterTitleInput').focus();
  }

  function closeNewChapterModal() {
    document.getElementById('newChapterModal').classList.add('hidden');
  }

  function createNewChapter() {
    const title = document.getElementById('chapterTitleInput').value.trim();
    if (!title) return;
    const data = getStorage();
    const work = data.works.find(w => w.id === data.currentWorkId);
    const newChapterId = Math.max(...work.chapters.map(ch => ch.id), 0) + 1;
    work.chapters.push({ id: newChapterId, title: title, content: '' });
    data.currentChapterId = newChapterId;
    saveStorage(data);
    closeNewChapterModal();
    document.getElementById('chapterTitleInput').value = '';
    loadEditor();
  }

  function deleteChapter(chapterId) {
    if (!confirm('Delete this chapter?')) return;
    const data = getStorage();
    const work = data.works.find(w => w.id === data.currentWorkId);
    work.chapters = work.chapters.filter(ch => ch.id !== chapterId);
    if (work.chapters.length === 0) {
      work.chapters.push({ id: 1, title: 'Chapter One', content: '' });
    }
    data.currentChapterId = work.chapters[0].id;
    saveStorage(data);
    loadEditor();
  }

  getStorage();
  renderShelf();

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeNewWorkModal();
      closeNewChapterModal();
    }
  });
</script>
</body>
</html>
