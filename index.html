<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FolioOS · Novel Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --clay:#9E5236; --ochre:#B08744; --moss:#67714F; --indigo:#39424F; --mulberry:#6D4650; --umber:#55402C;
    --paper:#EFE6D8; --paper-deep:#E7DCC9; --bone:#FBF6EC; --ink:#2A2219; --ink-soft:#5E5344;
    --graphite:#8B7E6B; --rule:#D9CDB9; --accent:var(--clay);
    --glide:cubic-bezier(0.22,1,0.36,1); --settle:cubic-bezier(0.33,1,0.68,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{font-family:'EB Garamond',serif; color:var(--ink); background:var(--paper); -webkit-font-smoothing:antialiased; overflow:hidden;}
  button,input,textarea,select{font-family:inherit; color:inherit;}
  button{cursor:pointer; border:none; background:none;}
  .hidden{display:none !important;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--rule); border-radius:5px; border:2px solid var(--paper);}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ===================== THRESHOLD ===================== */
  #threshold{
    position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 62%, #2a2119, #17130e 75%);
    color:var(--bone); cursor:pointer; transition:opacity 1s var(--glide);
  }
  #threshold .date{font-family:'Instrument Sans',sans-serif; font-size:13px; letter-spacing:.34em; text-transform:uppercase; color:#8a7c63; margin-bottom:26px;}
  #threshold .line{font-family:'Cormorant Garamond',serif; font-style:italic; font-size:38px; color:#efe6d3;}
  #threshold .hint{position:absolute; bottom:52px; font-style:italic; font-size:14px; color:#8a7c63;}
  #threshold.gone{opacity:0; pointer-events:none;}

  /* ===================== LIBRARY ===================== */
  #library{position:fixed; inset:0; overflow-y:auto; background:
      linear-gradient(180deg, var(--bone), var(--paper) 240px);}
  .lib-inner{max-width:1120px; margin:0 auto; padding:54px 48px 100px;}
  .lib-top{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:6px;}
  .wordmark{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:22px; letter-spacing:.32em; text-transform:uppercase; color:var(--ink);}
  .wordmark em{color:var(--clay); font-style:normal;}
  .lib-actions{display:flex; gap:22px;}
  .pencil{font-style:italic; font-size:15px; color:var(--ink-soft); border-bottom:1px solid transparent; padding-bottom:1px; transition:all .2s;}
  .pencil:hover{color:var(--clay); border-bottom-color:var(--clay);}
  .lib-sub{font-style:italic; font-size:18px; color:var(--ink-soft); margin-bottom:44px;}
  .shelf{display:grid; grid-template-columns:repeat(auto-fill, minmax(184px,1fr)); gap:46px 34px; align-items:end;}
  .novel{cursor:pointer; transition:transform .25s var(--glide);}
  .novel:hover{transform:translateY(-6px);}
  .cover{
    position:relative; width:100%; aspect-ratio:2/3; border-radius:3px 6px 6px 3px;
    box-shadow:0 10px 26px rgba(42,34,25,.28), inset 3px 0 6px rgba(0,0,0,.16), inset -1px 0 2px rgba(255,255,255,.1);
    overflow:hidden; display:flex; flex-direction:column; background-size:cover; background-position:center;
  }
  .cover::after{content:''; position:absolute; left:8px; top:0; bottom:0; width:2px; background:linear-gradient(90deg, rgba(0,0,0,.22), transparent);}
  .cover .cov-inner{position:relative; z-index:2; flex:1; display:flex; flex-direction:column; padding:22px 18px; text-align:center;}
  .cover .cov-top{flex:1; display:flex; align-items:center; justify-content:center;}
  .cover .cov-title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:26px; line-height:1.08; color:#f7f0e2; text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .cover .cov-rule{width:34px; height:1px; background:rgba(247,240,226,.6); margin:12px auto;}
  .cover .cov-author{font-family:'EB Garamond',serif; font-style:italic; font-size:14px; letter-spacing:.05em; color:#e7dcc4; text-shadow:0 1px 5px rgba(0,0,0,.5);}
  .cover.imgcov .cov-inner{background:linear-gradient(180deg, rgba(20,16,11,.28), rgba(20,16,11,.06) 40%, rgba(20,16,11,.62));}
  .novel-meta{margin-top:14px; text-align:center;}
  .novel-meta .nm{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:17px; color:var(--ink); line-height:1.1;}
  .novel-meta .wc{font-size:12.5px; color:var(--graphite); font-style:italic; margin-top:2px;}
  .new-novel .cover{background:transparent; box-shadow:none; border:1.5px dashed var(--rule); align-items:center; justify-content:center;}
  .new-novel .cover::after{display:none;}
  .new-novel .plus{font-size:40px; color:var(--graphite); font-weight:300;}
  .new-novel:hover .cover{border-color:var(--clay);} .new-novel:hover .plus{color:var(--clay);}

  /* ===================== WORKSPACE ===================== */
  #workspace{position:fixed; inset:0; display:flex; flex-direction:column;}
  .topbar{height:52px; display:flex; align-items:center; gap:20px; padding:0 20px; border-bottom:1px solid var(--rule); background:linear-gradient(180deg,var(--bone),var(--paper));}
  .back{font-style:italic; color:var(--ink-soft); font-size:15px; transition:color .2s;}
  .back:hover{color:var(--clay);}
  .crumb{display:flex; align-items:baseline; gap:10px; min-width:0;}
  .crumb .k{font-family:'Instrument Sans',sans-serif; font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--graphite);}
  .crumb .t{font-family:'Cormorant Garamond',serif; font-size:21px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .spacer{flex:1;}
  .vtog{display:flex; gap:2px; background:var(--paper-deep); border:1px solid var(--rule); border-radius:9px; padding:3px;}
  .vtog button{font-family:'Instrument Sans',sans-serif; font-size:11px; letter-spacing:.05em; padding:6px 14px; border-radius:6px; color:var(--ink-soft); transition:all .2s var(--glide);}
  .vtog button.active{background:var(--bone); color:var(--ink); box-shadow:0 1px 4px rgba(0,0,0,.08);}
  .ticon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--graphite);font-size:15px;transition:all .2s;}
  .ticon:hover{background:var(--paper-deep); color:var(--ink);}
  .ticon.on{color:var(--clay);}

  .frame{flex:1; display:flex; min-height:0;}
  .binder{width:250px; flex-shrink:0; background:var(--paper-deep); border-right:1px solid var(--rule); display:flex; flex-direction:column;}
  .center{flex:1; min-width:0; background:var(--paper); position:relative; overflow:hidden;}
  .inspector{width:296px; flex-shrink:0; background:var(--paper-deep); border-left:1px solid var(--rule); overflow-y:auto;}
  .frame.no-insp .inspector{display:none;}

  /* binder */
  .binder-head{padding:14px 14px 8px; display:flex; align-items:center; justify-content:space-between;}
  .binder-head .lbl{font-family:'Instrument Sans',sans-serif; font-size:9px; letter-spacing:.18em; text-transform:uppercase; color:var(--graphite);}
  .binder-tools{display:flex; gap:2px;}
  .binder-tools button{width:24px;height:24px;border-radius:5px;color:var(--graphite);font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .18s;}
  .binder-tools button:hover{background:var(--bone);color:var(--clay);}
  .cover-item{margin:2px 10px 6px; padding:8px 10px; border-radius:6px; display:flex; align-items:center; gap:9px; cursor:pointer; transition:background .15s;}
  .cover-item:hover{background:rgba(255,255,255,.5);}
  .cover-item.sel{background:var(--bone); box-shadow:inset 2px 0 0 var(--accent);}
  .cover-thumb{width:26px; height:38px; border-radius:2px; background-size:cover; background-position:center; box-shadow:0 1px 3px rgba(0,0,0,.25); flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .cover-thumb .mini{font-family:'Cormorant Garamond',serif; font-size:7px; color:#f7f0e2; text-align:center; line-height:1; padding:2px;}
  .cover-item .ci-txt{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:14.5px; color:var(--ink); line-height:1.05;}
  .cover-item .ci-sub{font-size:10px; color:var(--graphite); font-style:italic;}
  .tree{flex:1; overflow-y:auto; padding:0 8px 12px;}
  .row{display:flex; align-items:center; gap:5px; padding:5px 6px; border-radius:5px; font-size:14.5px; color:var(--ink-soft); cursor:pointer; user-select:none; position:relative;}
  .row:hover{background:rgba(255,255,255,.5);}
  .row.sel{background:var(--bone); color:var(--ink); box-shadow:inset 2px 0 0 var(--accent);}
  .row.drop-above{box-shadow:inset 0 2px 0 var(--clay);}
  .row.drop-in{background:rgba(158,82,54,.12);}
  .row .tw{width:12px;text-align:center;color:var(--graphite);font-size:9px;flex-shrink:0;transition:transform .18s var(--glide);}
  .row.open .tw{transform:rotate(90deg);}
  .row .ic{width:16px;flex-shrink:0;font-size:13px;opacity:.75;text-align:center;}
  .row .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
  .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row .ct{font-size:11px;color:var(--graphite);font-variant-numeric:tabular-nums;}
  .row .mv{display:none; gap:1px;}
  .row:hover .mv{display:flex;}
  .row:hover .ct{display:none;}
  .row .mv button{width:15px;height:15px;font-size:8px;color:var(--graphite);display:flex;align-items:center;justify-content:center;border-radius:3px;}
  .row .mv button:hover{background:var(--paper-deep);color:var(--clay);}
  .row.folder .nm{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:15.5px;}
  .row .rename{flex:1;font:inherit;background:var(--bone);border:1px solid var(--clay);border-radius:3px;padding:1px 4px;outline:none;}
  .binder-foot{padding:9px 14px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--graphite);font-style:italic;display:flex;justify-content:space-between;}
  .trash-head{margin:6px 14px 2px; font-family:'Instrument Sans',sans-serif; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--graphite); display:flex; justify-content:space-between; align-items:center;}
  .trash-head button{font-size:10px; font-style:italic; color:var(--graphite); text-transform:none; letter-spacing:0;}
  .trash-head button:hover{color:var(--clay);}

  /* cover view */
  .cover-view{height:100%; overflow-y:auto; display:flex; gap:52px; padding:52px 56px; justify-content:center;}
  .cover-stage{flex-shrink:0;}
  .big-cover{width:300px; aspect-ratio:2/3; border-radius:4px 8px 8px 4px; box-shadow:0 20px 50px rgba(42,34,25,.34), inset 4px 0 10px rgba(0,0,0,.18); overflow:hidden; display:flex; flex-direction:column; background-size:cover; background-position:center; position:relative;}
  .big-cover::after{content:''; position:absolute; left:12px; top:0; bottom:0; width:3px; background:linear-gradient(90deg, rgba(0,0,0,.24), transparent);}
  .bc-inner{position:relative; z-index:2; flex:1; display:flex; flex-direction:column; padding:38px 28px; text-align:center;}
  .bc-top{flex:1; display:flex; align-items:center; justify-content:center;}
  .bc-title{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:38px; line-height:1.06; color:#f7f0e2; text-shadow:0 2px 10px rgba(0,0,0,.55);}
  .bc-rule{width:44px;height:1px;background:rgba(247,240,226,.6);margin:18px auto;}
  .bc-author{font-family:'EB Garamond',serif;font-style:italic;font-size:17px;color:#ecdfc6;text-shadow:0 1px 8px rgba(0,0,0,.5);}
  .bc-sub{font-family:'EB Garamond',serif;font-style:italic;font-size:13px;color:#d6c8ab;margin-top:8px;text-shadow:0 1px 6px rgba(0,0,0,.5);}
  .big-cover.imgcov .bc-inner{background:linear-gradient(180deg, rgba(20,16,11,.3), rgba(20,16,11,.05) 40%, rgba(20,16,11,.66));}
  .cover-panel{width:340px; max-width:100%;}
  .cover-panel h2{font-family:'Cormorant Garamond',serif; font-weight:600; font-size:26px; margin-bottom:4px;}
  .cover-panel .ph{font-style:italic; color:var(--ink-soft); font-size:15px; margin-bottom:26px;}
  .field{margin-bottom:18px;}
  .field label{display:block; font-family:'Instrument Sans',sans-serif; font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--graphite); margin-bottom:6px;}
  .field input[type=text]{width:100%; background:var(--bone); border:1px solid var(--rule); border-radius:4px; padding:9px 11px; font-family:'Cormorant Garamond',serif; font-size:18px; outline:none; transition:border-color .2s;}
  .field input[type=text]:focus{border-color:var(--clay);}
  .cloth-row{display:flex; gap:9px; flex-wrap:wrap;}
  .cloth-dot{width:26px;height:26px;border-radius:50%; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.15); transition:transform .15s;}
  .cloth-dot:hover{transform:scale(1.12);}
  .cloth-dot.on{box-shadow:0 0 0 2px var(--bone), 0 0 0 4px var(--ink);}
  .mode-row{display:flex; gap:8px; margin-bottom:18px;}
  .seg{flex:1; text-align:center; font-family:'Instrument Sans',sans-serif; font-size:11px; letter-spacing:.04em; padding:8px; border:1px solid var(--rule); border-radius:6px; color:var(--ink-soft); background:var(--bone); transition:all .2s;}
  .seg.on{border-color:var(--clay); color:var(--ink); background:var(--paper);}
  .upload-btn{display:inline-block; font-style:italic; font-size:15px; color:var(--clay); border-bottom:1px solid var(--clay); padding-bottom:1px; cursor:pointer;}
  .cover-note{font-size:13px; color:var(--graphite); font-style:italic; margin-top:6px;}

  /* editor */
  .ed-scroll{height:100%; overflow-y:auto; display:flex; justify-content:center; padding:46px 20px 140px;}
  .sheet{width:100%; max-width:668px;}
  .scriv-div{display:flex;align-items:center;gap:14px;margin:44px 0 26px;opacity:.7;}
  .scriv-div .ln{flex:1;height:1px;background:var(--rule);}
  .scriv-div .lab{font-family:'Instrument Sans',sans-serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite);}
  .doc-title{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;color:var(--ink);margin-bottom:3px;outline:none;}
  .doc-sub{font-family:'Instrument Sans',sans-serif;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);margin-bottom:22px;}
  .prose{font-size:19px; line-height:1.66; color:#33291d; outline:none; min-height:300px;}
  .prose:empty::before{content:attr(data-ph); color:var(--graphite); font-style:italic;}
  .prose p{margin-bottom:1.05em;}
  .kept{margin-top:24px; font-style:italic; font-size:13px; color:var(--graphite); opacity:0; transition:opacity .4s;}
  .kept.show{opacity:1;}

  /* corkboard */
  .cork{height:100%; overflow-y:auto; padding:34px 40px 100px;
    background:repeating-linear-gradient(45deg, rgba(85,64,44,.014) 0 12px, transparent 12px 24px), var(--paper);}
  .cork-head{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:var(--ink-soft);margin-bottom:22px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(216px,1fr));gap:28px 24px;}
  .card{background:var(--bone);border-radius:3px;min-height:176px;box-shadow:0 3px 12px rgba(42,34,25,.14),0 1px 2px rgba(42,34,25,.1);display:flex;flex-direction:column;position:relative;cursor:pointer;transition:transform .2s var(--glide),box-shadow .2s;border-top:4px solid var(--accent);}
  .card:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 8px 22px rgba(42,34,25,.2);}
  .card::before{content:'';position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d8b46a,#9c7a34);box-shadow:0 1px 2px rgba(0,0,0,.35);}
  .card .ct{padding:14px 16px 8px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:19px;color:var(--ink);border-bottom:1px solid var(--rule);line-height:1.14;outline:none;}
  .card .cs{padding:11px 16px;font-size:14px;line-height:1.5;color:var(--ink-soft);flex:1;font-style:italic;outline:none;}
  .card .cs:empty::before{content:'A blank card, waiting.';opacity:.5;}
  .card .cf{padding:7px 16px 11px;display:flex;align-items:center;justify-content:space-between;}
  .card .cf .st{font-family:'Instrument Sans',sans-serif;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);border:1px solid var(--rule);border-radius:20px;padding:2px 8px;}
  .card .cf .wc{font-size:11px;color:var(--graphite);}
  .card .cmv{position:absolute; bottom:8px; right:10px; display:none; gap:2px;}
  .card:hover .cmv{display:flex;}
  .card:hover .cf .wc{visibility:hidden;}
  .card .cmv button{width:17px;height:17px;font-size:9px;border-radius:3px;color:var(--graphite);background:var(--paper-deep);display:flex;align-items:center;justify-content:center;}
  .card .cmv button:hover{color:var(--clay);}
  .add-card{background:transparent;border:1.5px dashed var(--rule);box-shadow:none;align-items:center;justify-content:center;color:var(--graphite);font-style:italic;}
  .add-card::before{display:none;} .add-card:hover{transform:none;border-color:var(--clay);color:var(--clay);}

  /* outliner */
  .outl{height:100%;overflow:auto;}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  thead th{position:sticky;top:0;background:var(--paper-deep);text-align:left;font-family:'Instrument Sans',sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--graphite);padding:12px 14px;border-bottom:1px solid var(--rule);font-weight:500;}
  tbody td{padding:9px 14px;border-bottom:1px solid rgba(217,205,185,.55);vertical-align:middle;color:var(--ink-soft);}
  tbody tr{cursor:pointer;}
  tbody tr:hover{background:var(--bone);}
  .o-title{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:7px;}
  .o-title.folder{font-weight:600;}
  .o-title .ic{font-size:12px;opacity:.7;}
  .o-syn{color:var(--graphite);font-style:italic;font-size:13px;}
  .o-badge{font-family:'Instrument Sans',sans-serif;font-size:9px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px;border:1px solid var(--rule);white-space:nowrap;}
  .o-words{text-align:right;font-variant-numeric:tabular-nums;color:var(--graphite);}
  .o-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .o-bar{height:6px;border-radius:4px;background:var(--paper);overflow:hidden;border:1px solid var(--rule);}
  .o-fill{height:100%;background:linear-gradient(90deg,var(--moss),var(--ochre));}

  /* inspector */
  .insec{padding:15px 18px;border-bottom:1px solid var(--rule);}
  .ilbl{font-family:'Instrument Sans',sans-serif;font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--graphite);margin-bottom:9px;}
  .syn-card{background:var(--bone);border:1px solid var(--rule);border-radius:3px;box-shadow:0 1px 4px rgba(42,34,25,.06);}
  .syn-card .st{padding:10px 13px 7px;font-family:'Cormorant Garamond',serif;font-weight:600;font-size:17px;color:var(--ink);border-bottom:1px dashed var(--rule);outline:none;}
  .syn-card .sy{padding:10px 13px;font-size:14px;line-height:1.5;color:var(--ink-soft);font-style:italic;min-height:70px;outline:none;}
  .syn-card .sy:empty::before{content:'What happens here, in a sentence…';opacity:.5;}
  .mrow{display:flex;align-items:center;justify-content:space-between;padding:7px 0;font-size:14px;}
  .mrow .ml{color:var(--graphite);font-size:13px;}
  .picker{display:flex;align-items:center;gap:6px;padding:4px 11px;border-radius:20px;border:1px solid var(--rule);background:var(--bone);font-size:13px;color:var(--ink);cursor:pointer;transition:border-color .2s;}
  .picker:hover{border-color:var(--clay);}
  .picker .dot{width:9px;height:9px;border-radius:50%;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{font-size:12px;padding:3px 10px;border-radius:14px;background:var(--bone);border:1px solid var(--rule);color:var(--ink-soft);display:flex;align-items:center;gap:5px;}
  .chip .x{cursor:pointer;color:var(--graphite);font-size:11px;}
  .chip .x:hover{color:var(--clay);}
  .chip.add{border-style:dashed;color:var(--graphite);cursor:pointer;}
  .notes-area{width:100%;min-height:94px;background:var(--bone);border:1px solid var(--rule);border-radius:3px;padding:10px 12px;font-family:'EB Garamond',serif;font-size:14px;line-height:1.5;color:var(--ink-soft);resize:vertical;outline:none;}
  .tbar{height:7px;border-radius:4px;background:var(--paper);overflow:hidden;margin-top:8px;border:1px solid var(--rule);}
  .tfill{height:100%;background:linear-gradient(90deg,var(--moss),var(--ochre));}
  .tnote{font-size:12px;color:var(--graphite);margin-top:6px;font-style:italic;}
  .target-input{width:66px;background:var(--bone);border:1px solid var(--rule);border-radius:4px;padding:3px 6px;font-size:13px;text-align:right;outline:none;}

  /* tiny popover menu */
  .menu{position:fixed;z-index:300;background:var(--bone);border:1px solid var(--rule);border-radius:7px;box-shadow:0 8px 26px rgba(42,34,25,.24);padding:5px;min-width:150px;}
  .menu button{display:block;width:100%;text-align:left;padding:7px 12px;border-radius:5px;font-size:14px;color:var(--ink-soft);}
  .menu button:hover{background:var(--paper-deep);color:var(--ink);}
  .menu .dotb{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle;}
  .menu .sep{height:1px;background:var(--rule);margin:4px 2px;}

  /* compile */
  .compile-btn{font-family:'Instrument Sans',sans-serif;font-size:11px;letter-spacing:.05em;padding:7px 15px;border-radius:7px;border:1px solid var(--rule);background:var(--bone);color:var(--ink-soft);transition:all .2s;}
  .compile-btn:hover{border-color:var(--clay);color:var(--clay);}
  .veil{position:fixed;inset:0;z-index:400;background:rgba(30,24,17,.44);backdrop-filter:blur(2px);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transition:opacity .3s;}
  .veil.show{opacity:1;visibility:visible;}
  .modal{background:var(--bone);border:1px solid var(--rule);border-radius:9px;box-shadow:0 26px 64px rgba(0,0,0,.36);width:460px;max-width:92vw;max-height:90vh;overflow:auto;padding:30px 32px;}
  .modal h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:27px;line-height:1.05;}
  .modal .sub{font-style:italic;color:var(--ink-soft);margin-bottom:24px;font-size:16px;}
  .modal .flabel{font-family:'Instrument Sans',sans-serif;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--graphite);margin:18px 0 8px;}
  .fmt-row{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;}
  .fmt{text-align:center;padding:13px 4px;border:1px solid var(--rule);border-radius:8px;background:var(--paper);cursor:pointer;transition:all .18s;}
  .fmt .ic{font-size:19px;display:block;margin-bottom:5px;line-height:1;}
  .fmt .nm{font-family:'Instrument Sans',sans-serif;font-size:10px;letter-spacing:.03em;}
  .fmt.on{border-color:var(--clay);background:var(--paper-deep);color:var(--ink);box-shadow:0 2px 9px rgba(158,82,54,.2);}
  .scope-sel{width:100%;padding:9px 11px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);font-family:'EB Garamond',serif;font-size:16px;outline:none;}
  .opt-row{display:flex;align-items:center;gap:11px;margin:11px 0;cursor:pointer;font-size:15.5px;user-select:none;}
  .opt-box{width:19px;height:19px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--clay);flex-shrink:0;}
  .modal-actions{display:flex;justify-content:flex-end;align-items:center;gap:20px;margin-top:28px;}
  .modal-actions .cancel{font-style:italic;color:var(--ink-soft);}
  .modal-actions .cancel:hover{color:var(--clay);}
  .modal-actions .go{background:var(--clay);color:var(--bone);padding:10px 24px;border-radius:7px;font-family:'Instrument Sans',sans-serif;font-size:13px;letter-spacing:.03em;transition:background .2s;}
  .modal-actions .go:hover{background:var(--umber);}
  .compile-note{font-size:12.5px;color:var(--graphite);font-style:italic;margin-top:14px;line-height:1.45;}
</style>
</head>
<body>

<div id="threshold"><div class="date" id="thDate"></div><div class="line" id="thLine">The room is quiet.</div><div class="hint">step inside</div></div>

<div id="library" class="hidden">
  <div class="lib-inner">
    <div class="lib-top">
      <div class="wordmark">Folio<em>·</em>OS <span style="font-size:13px;letter-spacing:.16em;color:var(--graphite);">Novel Studio</span></div>
      <div class="lib-actions"><button class="pencil" onclick="newNovel()">begin a new novel</button><button class="pencil" onclick="exportAll()">archive everything</button></div>
    </div>
    <div class="lib-sub" id="libGreeting">Your novels.</div>
    <div class="shelf" id="shelf"></div>
  </div>
</div>

<div id="workspace" class="hidden">
  <div class="topbar">
    <button class="back" onclick="toLibrary()">← the shelf</button>
    <div class="crumb"><span class="k">Novel</span><span class="t" id="wsTitle">—</span></div>
    <div class="spacer"></div>
    <div class="vtog" id="vtog">
      <button data-view="editor" class="active">Editor</button>
      <button data-view="corkboard">Corkboard</button>
      <button data-view="outliner">Outliner</button>
    </div>
    <button class="ticon" id="scrivBtn" title="Scrivenings — edit a whole folder as one flowing manuscript">⇉</button>
    <button class="ticon on" id="inspBtn" title="Toggle the inspector">◧</button>
    <button class="compile-btn" onclick="openCompile()" title="Compile your novel into PDF, Word, Markdown…">Compile</button>
  </div>
  <div class="frame" id="frame">
    <aside class="binder">
      <div class="binder-head">
        <span class="lbl">The Binder</span>
        <div class="binder-tools">
          <button onclick="addNode('doc')" title="New document">＋</button>
          <button onclick="addNode('folder')" title="New folder">🗀</button>
        </div>
      </div>
      <div class="cover-item" id="coverItem" onclick="openCover()"></div>
      <div class="tree" id="tree"></div>
      <div id="trashZone"></div>
      <div class="binder-foot"><span>Manuscript</span><span id="binderTotal">— words</span></div>
    </aside>
    <main class="center" id="center"></main>
    <aside class="inspector" id="inspector"></aside>
  </div>
</div>

<input type="file" id="coverFile" accept="image/*" class="hidden">

<script>
"use strict";
const KEY='folioNovelStudio_v1';
const PIG={clay:'#9E5236',ochre:'#B08744',moss:'#67714F',indigo:'#39424F',mulberry:'#6D4650',umber:'#55402C',graphite:'#8B7E6B'};
const LABELS=[['clay','Scene'],['umber','Chapter'],['indigo','Character'],['moss','Setting'],['ochre','Research'],['mulberry','Idea'],['graphite','None']];
const STATUS=['To Do','In Progress','First Draft','Revised','Final'];
const uid=()=>Math.random().toString(36).slice(2,10);
const pig=l=>PIG[l]||PIG.graphite;
const labelName=l=>{const f=LABELS.find(x=>x[0]===l);return f?f[1]:'None';};
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------------- state ----------------
let DB={projects:[]};
let cur=null;                // current project object
let view='editor', scriv=false, selId=null, inspectorOn=true;

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){ console.error('save failed',e); } }
function load(){ try{ const r=localStorage.getItem(KEY); if(r) DB=JSON.parse(r); }catch(e){ console.error('load failed',e); } if(!DB.projects) DB.projects=[]; }

function newDoc(name,opts={}){ return Object.assign({id:uid(),type:'doc',name:name||'Untitled',label:'clay',status:'To Do',synopsis:'',notes:'',content:'',keywords:[],target:1500},opts); }
function newFolder(name,opts={}){ return Object.assign({id:uid(),type:'folder',name:name||'New Folder',label:'umber',open:true,children:[]},opts); }

function seedDemo(){
  const p={
    id:uid(), title:'Ashes of Kano', author:'Basil', subtitle:'a novel', kind:'Novel',
    cover:{mode:'type', image:null, cloth:'clay'},
    createdAt:Date.now(), updatedAt:Date.now(),
    trash:[],
    binder:[
      newFolder('Part One — The City',{label:'clay',children:[
        newDoc('Kano, 1983',{label:'clay',status:'Revised',synopsis:'Amina returns to the compound the morning after the fire.',content:'<p>The morning after the fire, the compound smelled of nothing else, and Amina stood at the gate for a long time before she went in.</p><p>She had rehearsed this on the bus from Lagos — what she would feel, which of the rooms she would enter first. None of it survived the smell.</p>'}),
        newDoc('The Marketplace',{label:'ochre',status:'First Draft',synopsis:'A walk through the market that used to be her father’s.',content:'<p>The market opened whether or not the world had ended.</p>'}),
        newDoc('Letters Home',{label:'moss',status:'In Progress',synopsis:'Three unsent letters, each to a person now gone.',content:''}),
      ]}),
      newFolder('Part Two — The Fire',{label:'mulberry',open:false,children:[
        newDoc('Smoke',{label:'mulberry',synopsis:'The night itself, told out of order.',content:''}),
        newDoc('What the Ash Remembers',{label:'indigo',synopsis:'Closing movement. She keeps one brick.',content:''}),
      ]}),
      newFolder('Characters',{label:'indigo',open:false,children:[
        newDoc('Amina',{label:'indigo',status:'Final',synopsis:'34. Archivist. Believes memory is a duty, not a comfort.',content:''}),
      ]}),
      newFolder('Research',{label:'ochre',open:false,children:[
        newDoc('Kano fire — timeline',{label:'ochre',status:'Final',synopsis:'What is public record vs. what the novel invents.',content:''}),
      ]}),
    ]
  };
  DB.projects.push(p); save();
}

// ---------------- tree helpers ----------------
function walk(nodes,fn,depth=0,parent=null){ for(const n of nodes){ fn(n,depth,parent,nodes); if(n.children) walk(n.children,fn,depth+1,n); } }
function findNode(id,nodes){ nodes=nodes||cur.binder; for(const n of nodes){ if(n.id===id)return n; if(n.children){const f=findNode(id,n.children); if(f)return f;} } return null; }
function locate(id,nodes,parent){ nodes=nodes||cur.binder; for(let i=0;i<nodes.length;i++){ const n=nodes[i]; if(n.id===id) return {arr:nodes,index:i,parent:parent||null,node:n}; if(n.children){ const r=locate(id,n.children,n); if(r)return r; } } return null; }
function words(html){ const t=(html||'').replace(/<[^>]+>/g,' ').replace(/&[a-z]+;/g,' ').trim(); return t?t.split(/\s+/).length:0; }
function nodeWords(n){ if(n.type==='doc')return words(n.content); return (n.children||[]).reduce((s,c)=>s+nodeWords(c),0); }
function manuscriptWords(){ return cur.binder.reduce((s,n)=>s+nodeWords(n),0); }

// ---------------- screens ----------------
function renderLibrary(){
  const hour=new Date().getHours();
  const greet=hour<12?'Good morning.':hour<18?'Good afternoon.':'Good evening.';
  document.getElementById('libGreeting').textContent = DB.projects.length? greet+' Your novels.' : 'Every novel begins with a blank cover.';
  const shelf=document.getElementById('shelf'); shelf.innerHTML='';
  DB.projects.forEach(p=>{
    const el=document.createElement('div'); el.className='novel';
    el.innerHTML=coverHTML(p,'cover')+
      '<div class="novel-meta"><div class="nm">'+esc(p.title||'Untitled')+'</div><div class="wc">'+projWords(p).toLocaleString()+' words</div></div>';
    el.onclick=()=>openProject(p.id);
    shelf.appendChild(el);
  });
  const add=document.createElement('div'); add.className='novel new-novel';
  add.innerHTML='<div class="cover"><span class="plus">＋</span></div><div class="novel-meta"><div class="nm" style="color:var(--graphite);font-style:italic;">a new novel</div></div>';
  add.onclick=newNovel; shelf.appendChild(add);
}
function projWords(p){ return p.binder.reduce((s,n)=>s+nodeWords(n),0); }
function coverHTML(p,cls){
  const c=p.cover||{mode:'type',cloth:'clay'};
  if(c.mode==='image' && c.image){
    return '<div class="'+cls+' imgcov" style="background-image:url('+c.image+')"><div class="cov-inner"><div class="cov-top"></div>'+
      '<div class="cov-title">'+esc(p.title||'Untitled')+'</div><div class="cov-rule"></div><div class="cov-author">'+esc(p.author||'')+'</div></div></div>';
  }
  const g='linear-gradient(150deg, '+pig(c.cloth)+', '+shade(pig(c.cloth),-24)+')';
  return '<div class="'+cls+'" style="background:'+g+'"><div class="cov-inner"><div class="cov-top"><div class="cov-title">'+esc(p.title||'Untitled')+'</div></div>'+
    '<div class="cov-rule"></div><div class="cov-author">'+esc(p.author||'')+'</div></div></div>';
}
function shade(hex,amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)+amt,g=((n>>8)&255)+amt,b=(n&255)+amt; r=Math.max(0,Math.min(255,r));g=Math.max(0,Math.min(255,g));b=Math.max(0,Math.min(255,b)); return '#'+(r<<16|g<<8|b).toString(16).padStart(6,'0'); }

function openProject(id){ cur=DB.projects.find(p=>p.id===id); if(!cur)return; if(!cur.trash)cur.trash=[]; selId=firstDoc(cur.binder); view='editor'; scriv=false; show('workspace'); renderWorkspace(); }
function firstDoc(nodes){ for(const n of nodes){ if(n.type==='doc')return n.id; if(n.children){const f=firstDoc(n.children); if(f)return f;} } return nodes[0]?nodes[0].id:null; }
function toLibrary(){ save(); show('library'); renderLibrary(); }
function show(which){ ['threshold','library','workspace'].forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==which)); }

function newNovel(){
  const p={id:uid(),title:'Untitled Novel',author:'',subtitle:'a novel',kind:'Novel',cover:{mode:'type',image:null,cloth:'indigo'},createdAt:Date.now(),updatedAt:Date.now(),trash:[],
    binder:[ newFolder('Manuscript',{label:'umber',children:[ newDoc('Chapter One',{label:'clay',synopsis:'',content:''}) ]}) ]};
  DB.projects.push(p); save(); openProject(p.id); openCover();
}

// ---------------- workspace ----------------
function renderWorkspace(){ document.getElementById('wsTitle').textContent=cur.title||'Untitled'; renderBinder(); renderCenter(); renderInspector(); syncToggle(); }

function renderBinder(){
  // cover item
  const ci=document.getElementById('coverItem');
  ci.className='cover-item'+(view==='cover'?' sel':'');
  ci.innerHTML=coverThumb(cur)+'<div><div class="ci-txt">'+esc(cur.title||'Untitled')+'</div><div class="ci-sub">cover &amp; title page</div></div>';
  // tree
  const host=document.getElementById('tree'); host.innerHTML='';
  function draw(nodes,depth){
    nodes.forEach(n=>{
      const isF=n.type==='folder';
      const row=document.createElement('div');
      row.className='row'+(isF?' folder':'')+(n.open?' open':'')+(n.id===selId?' sel':'');
      row.style.paddingLeft=(6+depth*15)+'px';
      row.setAttribute('draggable','true'); row.dataset.id=n.id;
      row.innerHTML=
        '<span class="tw">'+(isF&&n.children&&n.children.length?'▶':'')+'</span>'+
        '<span class="ic">'+(isF?'▤':'▢')+'</span>'+
        '<span class="dot" style="background:'+pig(n.label)+'"></span>'+
        '<span class="nm">'+esc(n.name)+'</span>'+
        '<span class="ct">'+(isF?(n.children?n.children.length:0):(nodeWords(n)||'·'))+'</span>'+
        '<span class="mv"><button title="up" data-mv="up">▲</button><button title="down" data-mv="dn">▼</button></span>';
      row.onclick=(e)=>{
        if(e.target.dataset.mv){ e.stopPropagation(); moveNode(n.id, e.target.dataset.mv==='up'?-1:1); return; }
        if(isF && e.offsetX < (20+depth*15)){ n.open=!n.open; save(); renderBinder(); return; }
        selId=n.id; if(isF && view==='editor'){ view='corkboard'; } renderWorkspace();
      };
      row.ondblclick=(e)=>{ if(e.target.dataset.mv)return; startRename(row,n); };
      attachDrag(row,n);
      host.appendChild(row);
      if(isF && n.open && n.children) draw(n.children,depth+1);
    });
  }
  draw(cur.binder,0);
  document.getElementById('binderTotal').textContent=manuscriptWords().toLocaleString()+' words';
  renderTrash();
}
function coverThumb(p){
  const c=p.cover||{mode:'type',cloth:'clay'};
  if(c.mode==='image'&&c.image) return '<div class="cover-thumb" style="background-image:url('+c.image+')"></div>';
  return '<div class="cover-thumb" style="background:linear-gradient(150deg,'+pig(c.cloth)+','+shade(pig(c.cloth),-24)+')"><div class="mini">'+esc((p.title||'').split(' ').slice(0,3).join(' '))+'</div></div>';
}
function renderTrash(){
  const z=document.getElementById('trashZone');
  if(!cur.trash||!cur.trash.length){ z.innerHTML=''; return; }
  let h='<div class="trash-head"><span>Trash · '+cur.trash.length+'</span><button onclick="emptyTrash()">empty</button></div>';
  cur.trash.forEach(n=>{
    h+='<div class="row" style="padding-left:12px;opacity:.75"><span class="ic">'+(n.type==='folder'?'▤':'▢')+'</span><span class="nm">'+esc(n.name)+'</span>'+
       '<span class="mv" style="display:flex"><button title="restore" onclick="restoreNode(\''+n.id+'\')">↩</button></span></div>';
  });
  z.innerHTML=h;
}
function startRename(row,n){
  const nm=row.querySelector('.nm'); const inp=document.createElement('input'); inp.className='rename'; inp.value=n.name;
  nm.replaceWith(inp); inp.focus(); inp.select();
  const done=()=>{ n.name=inp.value.trim()||n.name; save(); renderWorkspace(); };
  inp.onblur=done; inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();inp.blur();} if(e.key==='Escape'){inp.value=n.name;inp.blur();} };
}

// ---- binder CRUD ----
function addNode(kind){
  const node = kind==='folder'? newFolder('New Folder') : newDoc('Untitled');
  let sel = selId?locate(selId):null;
  if(sel && sel.node.type==='folder'){ sel.node.children=sel.node.children||[]; sel.node.children.push(node); sel.node.open=true; }
  else if(sel){ sel.arr.splice(sel.index+1,0,node); }
  else cur.binder.push(node);
  selId=node.id; save(); renderWorkspace();
}
function moveNode(id,dir){
  const l=locate(id); if(!l)return; const j=l.index+dir;
  if(j<0||j>=l.arr.length)return;
  const [x]=l.arr.splice(l.index,1); l.arr.splice(j,0,x); save(); renderBinder();
}
function deleteNode(id){
  const l=locate(id); if(!l)return; const [x]=l.arr.splice(l.index,1); cur.trash.unshift(x);
  if(selId===id) selId=firstDoc(cur.binder);
  save(); renderWorkspace();
}
function restoreNode(id){
  const i=cur.trash.findIndex(n=>n.id===id); if(i<0)return; const [x]=cur.trash.splice(i,1); cur.binder.push(x); save(); renderWorkspace();
}
function emptyTrash(){ cur.trash=[]; save(); renderBinder(); }

// ---- drag reorder (same-level or into folder) ----
let dragId=null;
function attachDrag(row,n){
  row.addEventListener('dragstart',e=>{ dragId=n.id; e.dataTransfer.effectAllowed='move'; });
  row.addEventListener('dragover',e=>{ e.preventDefault(); row.classList.remove('drop-above','drop-in');
    if(n.type==='folder' && e.offsetX>30) row.classList.add('drop-in'); else row.classList.add('drop-above'); });
  row.addEventListener('dragleave',()=>row.classList.remove('drop-above','drop-in'));
  row.addEventListener('drop',e=>{ e.preventDefault(); const into=row.classList.contains('drop-in'); row.classList.remove('drop-above','drop-in');
    if(!dragId||dragId===n.id)return; doDrop(dragId,n.id,into); });
}
function doDrop(fromId,toId,into){
  const fl=locate(fromId); if(!fl)return; const target=findNode(toId);
  // guard: don't drop a folder into its own descendant
  if(fl.node.children && findNode(toId, fl.node.children)) return;
  const [moved]=fl.arr.splice(fl.index,1);
  if(into && target.type==='folder'){ target.children=target.children||[]; target.children.push(moved); target.open=true; }
  else { const tl=locate(toId); tl.arr.splice(tl.index,0,moved); }
  save(); renderBinder();
}

// ---------------- center views ----------------
function renderCenter(){ if(view==='cover')renderCover(); else if(view==='editor')renderEditor(); else if(view==='corkboard')renderCork(); else renderOutliner(); }

function renderCover(){
  const c=document.getElementById('center');
  const cv=cur.cover||(cur.cover={mode:'type',image:null,cloth:'clay'});
  c.innerHTML=
    '<div class="cover-view"><div class="cover-stage">'+bigCoverHTML(cur)+'</div>'+
    '<div class="cover-panel"><h2>The Cover</h2><div class="ph">The face your novel wears on the shelf.</div>'+
      '<div class="field"><label>Title</label><input type="text" id="cvTitle" value="'+esc(cur.title)+'"></div>'+
      '<div class="field"><label>Author</label><input type="text" id="cvAuthor" value="'+esc(cur.author||'')+'"></div>'+
      '<div class="field"><label>Subtitle</label><input type="text" id="cvSub" value="'+esc(cur.subtitle||'')+'"></div>'+
      '<div class="field"><label>Cover style</label><div class="mode-row">'+
        '<div class="seg'+(cv.mode==='type'?' on':'')+'" onclick="setCoverMode(\'type\')">Typographic</div>'+
        '<div class="seg'+(cv.mode==='image'?' on':'')+'" onclick="setCoverMode(\'image\')">Photograph</div></div>'+
      (cv.mode==='type'
        ? '<label>Cloth</label><div class="cloth-row">'+Object.keys(PIG).filter(k=>k!=='graphite').map(k=>'<div class="cloth-dot'+(cv.cloth===k?' on':'')+'" style="background:'+PIG[k]+'" onclick="setCloth(\''+k+'\')"></div>').join('')+'</div>'
        : '<span class="upload-btn" onclick="document.getElementById(\'coverFile\').click()">'+(cv.image?'replace image…':'upload an image…')+'</span>'+(cv.image?'<div class="cover-note">Title and author sit over the photograph.</div>':'<div class="cover-note">A cover you already have — a painting, a photograph.</div>'))+
      '</div></div></div>';
  const bind=(id,prop)=>{ const el=document.getElementById(id); if(!el)return; el.oninput=()=>{ cur[prop]=el.value; document.getElementById('wsTitle').textContent=cur.title||'Untitled'; refreshBigCover(); save(); }; };
  bind('cvTitle','title'); bind('cvAuthor','author'); bind('cvSub','subtitle');
}
function bigCoverHTML(p){
  const c=p.cover||{mode:'type',cloth:'clay'};
  if(c.mode==='image'&&c.image){
    return '<div class="big-cover imgcov" id="bigCover" style="background-image:url('+c.image+')"><div class="bc-inner"><div class="bc-top"></div>'+
      '<div class="bc-title">'+esc(p.title||'Untitled')+'</div><div class="bc-rule"></div><div class="bc-author">'+esc(p.author||'')+'</div>'+(p.subtitle?'<div class="bc-sub">'+esc(p.subtitle)+'</div>':'')+'</div></div>';
  }

function runCompile(){
  const v=document.getElementById('compileVeil');
  const opt={ titlePage:isOn(v,'titlePage'), titles:isOn(v,'titles'), breaks:isOn(v,'breaks') };
  const scope=v.querySelector('#scopeSel').value;

// ---- intermediate representation ----
function buildIR(roots,opt){
  const ir=[];
  if(opt.titlePage) ir.push({kind:'title',title:cur.title||'Untitled',author:cur.author||'',subtitle:cur.subtitle||''});
  (function walk(nodes,level){
    let prevDoc=false;
    (nodes||[]).forEach(n=>{
      if(!n) return;
      if(n.type==='folder'){ ir.push({kind:'heading',level:Math.min(level,3),text:n.name,part:level===1}); prevDoc=false; walk(n.children,level+1); }
      else {
        if(opt.titles) ir.push({kind:'heading',level:Math.min(level,4),text:n.name});
        else if(prevDoc) ir.push({kind:'break'});
        htmlToParas(n.content).forEach(p=>ir.push({kind:'para',runs:p}));
        prevDoc=true;
      }
    });
  })(roots,1);
  return ir;
}
function htmlToParas(html){
  if(!html||!html.trim()) return [];
  let root;
  try{ root=new DOMParser().parseFromString('<div id="r">'+html+'</div>','text/html').getElementById('r'); }
  catch(e){ return html.replace(/<[^>]+>/g,' ').split(/\n+/).filter(x=>x.trim()).map(t=>[{text:t,bold:false,italic:false}]); }
  const blocks=[...root.children].filter(e=>/^(P|DIV|H\d|BLOCKQUOTE|LI)$/.test(e.tagName));
  const paras=[];
  if(blocks.length){ blocks.forEach(b=>{ const runs=[]; inlineRuns(b,false,false,runs); const m=mergeRuns(runs); if(m.some(r=>r.text.trim())) paras.push(m); }); }
  else { const runs=[]; inlineRuns(root,false,false,runs); const m=mergeRuns(runs); const txt=m.map(r=>r.text).join(''); txt.split(/\n+/).forEach(l=>{ if(l.trim()) paras.push([{text:l,bold:false,italic:false}]); }); }
  return paras;
}
function inlineRuns(node,bold,italic,out){
  node.childNodes.forEach(ch=>{
    if(ch.nodeType===3){ if(ch.textContent) out.push({text:ch.textContent,bold,italic}); }
    else if(ch.nodeType===1){ const t=ch.tagName; if(t==='BR'){ out.push({text:'\n',bold,italic}); return; }
      inlineRuns(ch, bold||t==='B'||t==='STRONG', italic||t==='I'||t==='EM', out); }
  });
}
function mergeRuns(runs){ const out=[]; runs.forEach(r=>{ const l=out[out.length-1]; if(l&&l.bold===r.bold&&l.italic===r.italic) l.text+=r.text; else out.push({text:r.text,bold:r.bold,italic:r.italic}); }); return out; }

// ---- markdown ----
function runsMD(runs){ return runs.map(r=>{ let t=r.text.replace(/\n/g,' '); if(r.bold)t='**'+t+'**'; if(r.italic)t='*'+t+'*'; return t; }).join(''); }
function renderMD(ir){ let o=''; ir.forEach(x=>{
  if(x.kind==='title') o+='# '+x.title+'\n\n'+(x.subtitle?'*'+x.subtitle+'*\n\n':'')+(x.author?'by '+x.author+'\n\n':'')+'---\n\n';
  else if(x.kind==='heading') o+='\n'+'#'.repeat(Math.min(x.level+1,6))+' '+x.text+'\n\n';
  else if(x.kind==='break') o+='\n* * *\n\n';
  else if(x.kind==='para') o+=runsMD(x.runs)+'\n\n';
}); return o.trim()+'\n'; }

// ---- plain text ----
function renderTXT(ir){ let o=''; ir.forEach(x=>{
  if(x.kind==='title') o+=(x.title||'').toUpperCase()+'\n'+(x.subtitle?x.subtitle+'\n':'')+(x.author?'by '+x.author+'\n':'')+'\n\n';
  else if(x.kind==='heading') o+='\n'+(x.level===1?(x.text||'').toUpperCase():x.text)+'\n\n';
  else if(x.kind==='break') o+='\n          *  *  *\n\n';
  else if(x.kind==='para') o+=x.runs.map(r=>r.text.replace(/\n/g,' ')).join('')+'\n\n';
}); return o.trim()+'\n'; }

// ---- html / pdf ----
function runsHTML(runs){ return runs.map(r=>{ let t=esc(r.text).replace(/\n/g,'<br>'); if(r.bold)t='<strong>'+t+'</strong>'; if(r.italic)t='<em>'+t+'</em>'; return t; }).join(''); }
function renderHTMLDoc(ir,opt,forPrint){
  let body='';
  ir.forEach(x=>{
    if(x.kind==='title') body+='<div class="tp"><h1 class="tt">'+esc(x.title)+'</h1>'+(x.subtitle?'<div class="ts">'+esc(x.subtitle)+'</div>':'')+(x.author?'<div class="ta">by '+esc(x.author)+'</div>':'')+'</div>';
    else if(x.kind==='heading'){ const L=Math.min(x.level+1,6); body+='<h'+L+' class="hd'+(x.part?' part':'')+'">'+esc(x.text)+'</h'+L+'>'; }
    else if(x.kind==='break') body+='<div class="sb">◆</div>';
    else if(x.kind==='para') body+='<p>'+runsHTML(x.runs)+'</p>';
  });
  let css="body{font-family:'EB Garamond',Georgia,serif;color:#221b12;max-width:44rem;margin:0 auto;padding:56px 40px;line-height:1.7;font-size:19px;}"+
    "h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;text-align:center;line-height:1.15;}"+

// ---- real .docx (inline STORE zip, no dependencies) ----
function xesc(s){ return (s==null?'':String(s)).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function runXML(r){ const t=r.text.replace(/\n/g,' '); let rpr=''; if(r.bold||r.italic) rpr='<w:rPr>'+(r.bold?'<w:b/>':'')+(r.italic?'<w:i/>':'')+'</w:rPr>'; return '<w:r>'+rpr+'<w:t xml:space="preserve">'+xesc(t)+'</w:t></w:r>'; }
function docxBody(ir,opt){
  let x='';
  ir.forEach(it=>{
    if(it.kind==='title'){
      x+='<w:p><w:pPr><w:pStyle w:val="Title"/></w:pPr><w:r><w:t xml:space="preserve">'+xesc(it.title)+'</w:t></w:r></w:p>';
      if(it.subtitle) x+='<w:p><w:pPr><w:jc w:val="center"/></w:pPr><w:r><w:rPr><w:i/></w:rPr><w:t xml:space="preserve">'+xesc(it.subtitle)+'</w:t></w:r></w:p>';
      if(it.author) x+='<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:before="240"/></w:pPr><w:r><w:t xml:space="preserve">by '+xesc(it.author)+'</w:t></w:r></w:p>';
      x+='<w:p><w:r><w:br w:type="page"/></w:r></w:p>';
    } else if(it.kind==='heading'){
      const hs='Heading'+Math.min(it.level,3);
      const pb=(opt.breaks&&it.part)?'<w:pageBreakBefore/>':'';
      x+='<w:p><w:pPr><w:pStyle w:val="'+hs+'"/>'+pb+'</w:pPr><w:r><w:t xml:space="preserve">'+xesc(it.text)+'</w:t></w:r></w:p>';
    } else if(it.kind==='break'){
      x+='<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:before="240" w:after="240"/></w:pPr><w:r><w:t>◆</w:t></w:r></w:p>';
    } else if(it.kind==='para'){
      x+='<w:p><w:pPr><w:ind w:firstLine="360"/></w:pPr>'+it.runs.map(runXML).join('')+'</w:p>';
    }
  });
  return x;
}

const CRC_TABLE=(()=>{ const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; } return t; })();
function crc32(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_TABLE[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function u8cat(arrs){ let n=0; arrs.forEach(a=>n+=a.length); const o=new Uint8Array(n); let p=0; arrs.forEach(a=>{o.set(a,p);p+=a.length;}); return o; }
function zipStore(files){
  const enc=new TextEncoder();
  const u16=n=>new Uint8Array([n&255,(n>>8)&255]);
  const u32=n=>new Uint8Array([n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255]);
  const locals=[], centrals=[]; let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name), data=f.bytes, crc=crc32(data);
    const local=u8cat([u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),name,data]);
    locals.push(local);
    centrals.push(u8cat([u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset),name]));
    offset+=local.length;
  });
  const cd=u8cat(centrals); const cdStart=offset;
  const end=u8cat([u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cd.length),u32(cdStart),u16(0)]);
  return u8cat([u8cat(locals),cd,end]);
}
function download(name,text,mime){ const b=new Blob([text],{type:(mime||'text/plain')+';charset=utf-8'}); trigger(name,b); }
function downloadBytes(name,bytes,mime){ trigger(name,new Blob([bytes],{type:mime})); }
